  - type: subheading
    text: Was ich über probabilistische Tools gelernt habe

  - type: bracketBlock
    stats:
      - value: "≈5×"
        description: "generierte Bilder für jedes, das es in die finale Auswahl geschafft hat"

  - type: media
    src: /media/garden/philipp-plein-fw26/selection-wall.jpg
    alt: Eine Wand mit Dutzenden ausgewählter KI-generierter Kampagnenbilder
    caption: Die Selects-Wand. Und das ist nur, was die Auswahl überlebt hat
    aspect: 'auto'
    variant: bare
    rounded: true

  - type: process
    steps:
      - title: "Generieren ist billig; Auswählen ist die Arbeit"
        text: "Für jedes Bild, das es in die Kampagne geschafft hat, wurden rund fünf weitere generiert, verglichen und verworfen. Der Grossteil meiner Zeit ging in Suchen, Aussortieren und Auswählen, nicht ins Prompting."
      - title: "Konsistenz ist der schwierige Teil"
        text: "Ein Produkt, ein Model und ein Licht über Bilder und Bewegtbild hinweg zu halten, bedeutete, FW26-Teile aus Runway-Screenshots nachzubilden und gegen die Eigenheiten jedes einzelnen Tools zu iterieren."
      - title: "Leitung wird nicht automatisiert, sie wird verstärkt"
        text: "Die Tools haben meinen Output vervielfacht, aber jede Entscheidung, die daraus eine Kampagne statt eines Moodboards gemacht hat, war menschlich."

  - type: subheading
    text: Was ich geliefert habe

  - type: bullets
    items:
      - Responsives Homepage-Konzept für Desktop, Tablet und Mobile
      - "Drei recherchierte UX-Verbesserungen: Header, Produktkarte und Footer"
      - FW26-Launchfilm, KI-generiert unter meiner kreativen Leitung
      - Editorials, Packshots und Kampagnenbilder, mit Produkten aus öffentlichem Runway-Material nachgebildet
      - Komponentenbasiertes Figma-System mit Variablen, Auto-Layout und Design-Tokens, MCP-freundlich strukturiert
      - Instagram-Launchkampagne mit neun Posts und ein Launch-Newsletter
      - Vollständiger Research- und Designprozess, dokumentiert in FigJam

  - type: subheading
    text: Der Instagram-Launch

  - type: prose
    paragraphs:
      - "Eine Feed-Komposition aus neun Posts, die FW26 über Bewegung, Attitüde und den PLEIN-Lifestyle einführt. Retro-inspirierte Collection-Reels, Runway- und Celebrity-Momente, die die Marke kulturell präsent halten, und ein abschliessendes Carousel, das Follower in die Kollektion mitnimmt. Luxuskommunikation sollte Identifikation schaffen, bevor sie Conversion verlangt."

  - type: media
    src: /media/garden/philipp-plein-fw26/instagram.jpg
    alt: Instagram-Feed-Komposition aus neun Posts für den FW26-Launch
    caption: Die Feed-Komposition aus neun Posts für den FW26-Launch
    aspect: 'auto'
    variant: bare
    rounded: true

  - type: subheading
    text: Der Launch-Newsletter

  - type: prose
    paragraphs:
      - "Der FW26-Launch-Newsletter bringt die Kampagne ins Postfach: modulare Blöcke, die in echten E-Mail-Clients technisch umsetzbar sind, ohne die visuelle Identität der Kampagne zu opfern."

  - type: media
    src: /media/garden/philipp-plein-fw26/newsletter.png
    alt: Das Design des FW26-Launch-Newsletters, vom Hero-Art bis zum Footer
    caption: Der Launch-Newsletter, vom Hero-Art bis zum Footer
    aspect: 'auto'
    variant: bare
    rounded: true
    maxWidth: xs

  - type: subheading
    text: Drei recherchierte UX-Verbesserungen

  - type: prose
    paragraphs:
      - "Die Studie ist kein Reskin. Das Design wurde auf dem bestehenden E-Commerce aufgebaut und respektiert dessen Katalog, Inhalte und technische Grenzen. Darauf aufbauend habe ich drei Verbesserungen dokumentiert, gestützt auf Usability-Forschung, nicht auf Geschmack."

  - type: process
    steps:
      - title: Header
        text: "Produktkategorien sichtbar auf der ersten Navigationsebene (versteckte Navigation senkt die Auffindbarkeit um fast 50%, NN/g), dazu eine kontextbezogene Utility-Leiste für Standort, Sprache und Support."
      - title: Produktkarte
        text: "Der Produktname führt die Hierarchie an, storeweite Botschaften wurden in eine globale Highlights-Sektion verschoben, und Grössen, Farben und weitere Ansichten erscheinen beim Hover."
      - title: Footer
        text: "Ein neuer globaler Benefits-Bereich bündelt storeweite Botschaften an einem Ort, neu gestaltet mit metallischen Akzenten, die der Marke gerecht werden."

  - type: prose
    paragraphs:
      - "Diese Studie ist der Grund, warum ich glaube, dass die nächsten Designrollen hybrid sind: Der Wert liegt nicht im Bedienen der Tools, sondern darin zu wissen, was man von ihnen verlangt, und was man verwirft."
