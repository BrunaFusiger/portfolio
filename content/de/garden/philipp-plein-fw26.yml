title: Philipp Plein FW26 Kampagnenstudie
heroImage: /media/garden/philipp-plein-fw26/hero.png
heroAlt: KI-generiertes Kampagnenvisual für die FW26-Konzeptstudie, ein Paar und ein Wolf im Schnee, mit dem Slogan «Control the day. Own the night.»
tags:
  - Generative KI
  - Creative Direction
  - Fashion
  - Konzeptstudie

body:
  - type: highlighted
    text: "Eine selbst initiierte Studie: Kann generative KI eine vollständige Luxuskampagne produzieren, die visuell, narrativ und kommerziell zusammenhält, wenn ein Mensch die kreative Leitung übernimmt?"

  - type: disclaimer
    text: "Dies ist eine unabhängige Konzeptstudie zu Lernzwecken. Sie ist nicht mit PHILIPP PLEIN verbunden, nicht von PHILIPP PLEIN beauftragt und nicht von PHILIPP PLEIN autorisiert. Die gezeigten Produkte wurden ausschliesslich zu Studienzwecken aus öffentlichem FW26-Runway-Material nachgebildet."

  - type: prose
    paragraphs:
      - "Generative KI verändert, wie Fashion-Content produziert wird, aber die meisten KI-Kampagnen sehen immer noch nach KI aus. Ich wollte das Gegenteil testen: eine der maximalistischsten Marken der Modewelt wählen, mir selbst ein echtes Briefing geben und generative Tools so führen, wie ich ein Produktionsteam führen würde."
      - "Am Anfang stand die Recherche. Ich habe die Marke und ihren Gründer, die komplette FW26-Runway-Show, Editorials, Wettbewerber und das Verhalten von Luxuskonsumenten untersucht, strukturiert nach dem Double Diamond."

  - type: highlighted
    text: "Das Ergebnis: FW26 ist eine Garderobe für luxuriöses Winterreisen. Beherrscht am Tag, entfesselt in der Nacht. Diese Dualität wurde zur Kampagne, Control the day. Own the night., angesiedelt am einzigen Ort, der beides verkörpert: St. Moritz."

  - type: video
    src: /media/garden/philipp-plein-fw26/homepage.mp4
    placeholderLabel: FW26-Homepage-Konzept
    alt: Scroll durch das FW26-Desktop-Homepage-Konzept
    caption: "Das responsive Homepage-Konzept: von der Kampagnengeschichte zu Product Discovery, Editorials und Handwerkskunst"
    variant: bare
    aspect: 'auto'

  - type: subheading
    text: KI als Produktionswerkzeug unter menschlicher kreativer Leitung

  - type: prose
    paragraphs:
      - "Die Regel, die ich mir gesetzt habe: Die KI generiert, ich führe Regie. Jedes Ergebnis musste dem Konzept, den Markencodes und einer bewusst gewählten Early-2000s-Canon-Ästhetik dienen, nicht dem Standard-Look des Modells."

  - type: inlineTags
    items:
      - ChatGPT / GPT Image
      - Nano Banana (Gemini)
      - Gemini Video / Veo
      - Kling AI 3.0
      - Hailuo AI
      - Luma AI

