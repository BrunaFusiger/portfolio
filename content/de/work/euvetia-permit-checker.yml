title: Permit Checker

subtitle: Schweizer Permit Checker, der dichte Einwanderungsregeln in ein kurzes, visuelles und personalisiertes Ergebnis übersetzt hat.

tags:
  - UX/UI
  - product design
  - information architecture
  - content design
  - design system
  - complex systems
  - bento UI
  - legal simplification
  - personalization
  - research
  - prototyping

