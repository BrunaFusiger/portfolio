sections:
  - type: heading
    text: Projektüberblick

  - type: scrollytelling

  - type: video
    src: /media/cases/euvetia-platform/home-desktop.mp4

  - type: prose
    paragraphs:
      - "Relocationsplattform für Brasilianerinnen und Brasilianer mit europäischem Pass, die in die Schweiz ziehen wollen. Inhalte, Tools und Community an einem Ort."
      - "Ich kam als einzige Gründungs-Produkt-Designerin dazu und arbeitete von Anfang bis Ende mit einer Entwicklerperson zusammen. Ich verantwortete den gesamten Design-Scope: Research, Produktstrategie, Markenstrategie, UX/UI, Informationsarchitektur, UX writing und Übergabe ans Front-end."
      - "Das Produkt ging offiziell im April 2026 live."

  - type: prose
    paragraphs:
      - "Die Chance ergab sich aus zwei Gründen, die für uns stimmig waren."

  - type: prose
    paragraphs:
      - "Brasilianische Migration ist gross und wächst:"

  - type: stat
    value: "4,9 Millionen"
    description: Brasilianerinnen und Brasilianer lebten 2023 im Ausland

  - type: stat
    value: Europa
    description: als zweitgrösste Zielregion nach Nordamerika

  - type: prose
    paragraphs:
      - "Das Personenfreizügigkeitsabkommen der Schweiz mit der EU eröffnet EU-Bürgerinnen und EU-Bürgern einen echten rechtlichen Weg, in der Schweiz zu leben und zu arbeiten. Für Brasilianerinnen und Brasilianer mit europäischem Pass bleibt das oft unsichtbar — genau dort lag die Chance."
      - "Aktuelle Forschung bestätigte die Nachfrage:"

  - type: stat
    value: "40%"
    description: "der Brasilianerinnen und Brasilianer sind am Leben im Ausland interessiert; unter den bevorzugten Zielen taucht die Schweiz in der engeren Auswahl auf, auch wenn sie weit hinter offensichtlicheren Wahlen wie den USA und Portugal liegt."


  - type: heading
    text: Das Problem

  - type: prose
    paragraphs:
      - "Das Problem war nicht fehlendes Wissen. Es fehlte Struktur."
      - "YouTube-Videos, Blogposts, WhatsApp-Gruppen, Behörden-Seiten, Expat-Foren. Überall gab es Teilantworten. Aber kein einziges Produkt half den Menschen wirklich zu klären:"

  - type: bullets
    items:
      - ob die Schweiz für ihren Fall überhaupt realistisch war
      - welcher Aufenthalts- und Bewilligungsweg zu ihnen passte
      - womit sie zuerst starten sollten
      - wie sie Kantone, Jobs, Steuern und Lebenshaltungskosten vergleichen können
      - wie sie bürokratisches Risiko vor dem Umzug senken können

  - type: prose
    paragraphs:
      - "Das waren keine neugierigen Scrollenden. Das waren Menschen mit Entscheidungen, die alles verändern — Bewilligungen, Wohnen, Gesundheit, Familienplanung."
      - "Das Kernproblem wurde:"

  - type: highlighted
    text: "Brasilianerinnen und Brasilianer mit EU-Pass hatten legale Wege in die Schweiz, aber kein zentrales, portugiesischsprachiges Produkt, das Komplexität in klare nächste Schritte übersetzte."

  - type: prose
    paragraphs:
      - "Wir hatten früh ein Signal über eine YouTube-Community und ein Beta-Zugangsmodell: Nutzerinnen und Nutzer waren bereit, für strukturierte Begleitung zu zahlen, statt alles alleine zusammenzupuzzeln."

  - type: lottie
    src: /animations/euvetia-problem.json

  - type: heading
    text: Was mich überrascht hat

  - type: prose
    paragraphs:
      - "Die Menschen wollten nicht vor allem mehr Information. Sie wollten Einordnung, Reihenfolge und Sicherheit."
      - "Mit anderen Worten: Der eigentliche Friktionpunkt war nicht zu wenig Content. Es war Entscheidungsüberlastung."
      - "Vier Muster kamen immer wieder:"

  - type: subheading
    text: 1. Die Schweiz war unterrepräsentiert

  - type: prose
    paragraphs:
      - "Viele dachten zuerst an Portugal, Spanien, Kanada oder die USA. Die Schweiz war oft gar nicht als realistische Option präsent. Ein Teil unserer Arbeit war Aufklärung — zu zeigen, dass der Weg existiert, bevor man ihn gehen kann."

  - type: media
    src: /media/cases/euvetia-platform/top-destinations.png
    alt: Stilisierte 3D-Figuren in einer Reihe, von gross nach klein, mit Nationalflaggen auf dem Kopf—USA, Portugal, Kanada, Spanien und Vereinigtes Königreich—als abgestufte Präferenz für Auswanderungsziele.
    aspect: "16/9"
    variant: bare

  - type: subheading
    text: 2. Menschen brauchten Führung

  - type: prose
    paragraphs:
      - "Wer noch am Erkunden war, hatte völlig andere Bedürfnisse als jemand, der bereits Kosten simulierte. Eine flache Content-Experience würde beide enttäuschen. Das Produkt musste sich dem Stadium anpassen, in dem die Person wirklich steht."

  - type: subheading
    text: 3. Vertrauen musste gestaltet werden, nicht nur behauptet

  - type: prose
    paragraphs:
      - "Migrationsprodukte kippen schnell in Sensationalismus, Vage oder zu viel Marketing. Klarheit, Zurückhaltung und Belege kamen bei den Nutzerinnen und Nutzern besser an."

  - type: subheading
    text: 4. Einfache Tools schufen unverhältnismässig viel Wert

  - type: prose
    paragraphs:
      - "Kantone zu vergleichen, Steuern zu verstehen, Monatskosten abzuschätzen und Pfade rund um Bewilligungen zu prüfen war in der Praxis oft hilfreicher als ein langer Artikel allein."

  - type: video
    src: /media/cases/euvetia-platform/euvetia-architechture.mp4

  - type: heading
    text: Von der Discovery zur Produktstrategie

  - type: prose
    paragraphs:
      - "Das Projekt folgte einer Double-Diamond-Struktur. (Nicht als Hülle, sondern als echte Arbeitsweise.)"

  - type: heading
    text: Discover

  - type: prose
    paragraphs:
      - "Ich habe den Problemraum mit Interviews, Desk Research, Competitor Review, Verhaltensbeobachtung, Affinity Clustering und Personas kartiert. Ziel war, die Welt der Nutzerinnen und Nutzer zu verstehen, bevor Lösungen vorgeschlagen werden."

  - type: media
    src: /media/cases/euvetia-platform/personas.png
    alt: Figma-Arbeitsfläche mit der Discover-Phase des Double Diamond für Euvetia—Research-Boards, Personas, Journey Maps und UI-Explorationen.
    caption: "Personas in Figma—Nutzertypen aus Verhaltensmustern und Bedürfnissen der discovery research."
    variant: bare
    aspect: "16/9"

  - type: media
    src: /media/cases/euvetia-platform/discovery.png
    alt: Figma-Arbeitsfläche mit der Discover-Phase des Double Diamond für Euvetia—Research-Boards, Personas, Journey Maps und UI-Explorationen.
    caption: "Double Diamond in Figma—discovery research, affinity mapping, Personas, Journeys und frühe Flows, die das Team synchron hielten."
    aspect: "16/9"

  - type: heading
    text: Define

  - type: prose
    paragraphs:
      - "Die Forschung führte zu einem klaren Schluss:"
      - "Euvetia sollte sich nicht wie ein Medienportal verhalten."

  - type: highlighted
    text: "Es sollte sich wie ein *Schweizer Taschenmesser für die Relocation* verhalten."

  - type: prose
    paragraphs:
      - "Alles, was für den Umzug nötig war, an einem Ort."
      - "Daraus wurden vier strategische Entscheidungen:"

  - type: bullets
    items:
      - "die Experience um Nutzerintention statt um Content-Typ zu organisieren"
      - "Aufklärung + Tools + Community zu verbinden"
      - "kognitive Last mit stage-based navigation zu reduzieren"
      - "Glaubwürdigkeit über eine ruhige, schweizerisch inspirierte visuelle Sprache aufzubauen"

  - type: media
    src: /media/cases/euvetia-platform/define.png
    alt: Figma-Arbeitsfläche mit der Define-Phase des Double Diamond für Euvetia—Produktthese, strategische Entscheidungen und UI-Explorationen.
    caption: "Affinity map in Figma—Ideen sammeln und clustern, Themen und Group mapping—Notizen aus der Discovery zu Themen bündeln, bevor die Produktthese steht."
    variant: bare
    aspect: "16/9"

  - type: heading
    text: Develop

  - type: prose
    paragraphs:
      - "Mit klarer Strategie habe ich das in Architektur und Flows übersetzt:"

  - type: bullets
    items:
      - "Plattformarchitektur"
      - "Kernnavigation"
      - "Dashboard-Logik"
      - "Content-Gruppierung"
      - "Tool-Priorisierung"
      - "Community-Kontaktpunkte"
      - "Einstiege zum Permit-checker"
      - "Wireframes und Interaktionsflows"

  - type: media
    src: /media/cases/euvetia-platform/develop.png
    alt: Figma-Arbeitsfläche mit dem User Flow von Euvetia.
    caption: "Der Euvetia-Userflow in Figma aus der Develop-Phase."
    variant: bare
    aspect: "16/9"

  - type: heading
    text: Deliver

  - type: prose
    paragraphs:
      - "Ich habe die komplette produktionsreife Experience gestaltet und den Handoff vorbereitet:"

  - type: bullets
    items:
      - "Markenidentität"
      - "responsive Plattform-Screens"
      - "User flows"
      - "Component library"
      - "UX writing"
      - "Design tokens — Figma MCP friendly"

  - type: media
    src: /media/cases/euvetia-platform/delivery.png
    alt: Euvetia-Figma-Datei mit Seiten nach Viewport, Component Library und Artboards für design-to-dev-Handoff.
    caption: "Die Master-Figma-Datei—Seiten: klar strukturierte component-per-page-Organisation, bei der Patterns, States und responsive Varianten zum tatsächlichen Build passen—kohärent, skalierbar und bereit für End-to-End-Entwicklung, ohne Nuancen zwischen Design und Engineering zu verlieren."
    aspect: "16/9"

  - type: heading
    text: Informationsarchitektur

  - type: prose
    paragraphs:
      - "Wir haben das Produkt in klare Bereiche gruppiert, etwa:"

  - type: bullets
    items:
      - "Inhalte"
      - "Inserate / Chancen"
      - "Tools"
      - "Forum"
      - "Chat"

  - type: prose
    paragraphs:
      - "Im Tools-Bereich der Home führten wir eine Segmentierung nach Journey-Stage ein:"

  - type: bullets
    items:
      - Erkunden
      - Simulieren
      - Leben

  - type: prose
    paragraphs:
      - "So wurde es ruhiger und persönlicher, ohne schweres Onboarding. Wer noch erkundete, konnte Kantone und Jobs vergleichen. Wer weiter war, konnte Kosten schätzen, Krankenversicherungen prüfen und konkret planen."
      - "Aus einem überwältigenden Thema wurde etwas, das man Schritt für Schritt navigieren kann."

  - type: video
    src: /media/cases/euvetia-platform/tools.mp4

  - type: heading
    text: Marke und Interface

  - type: prose
    paragraphs:
      - "Marke und UI baute ich auf Prinzipien, die vom Swiss design inspiriert sind:"

  - type: bullets
    items:
      - "Klarheit statt Dekoration"
      - "starke Hierarchie"
      - "funktionale Layouts"
      - "hoher Kontrast"
      - "minimale Palette"
      - "direkte Sprache"
      - "geometrische Konsistenz"

  - type: prose
    paragraphs:
      - "Das war strategisch wichtig. Bei Bürokratie und Relocation wirkt visuelles Rauschen wie Risiko. Eine ruhigere Oberfläche signalisiert Stabilität, Legitimität und Kontrolle."

  - type: media
    src: /media/cases/euvetia-platform/euvetia-brand-1.png
    alt: ""
    variant: bare
    aspect: "16/9"
    rounded: true

  - type: media
    src: /media/cases/euvetia-platform/euvetia-brand-2.png
    alt: ""
    variant: bare
    aspect: "auto"
    rounded: true

  - type: media
    src: /media/cases/euvetia-platform/Euvetia-logo.png
    alt: Euvetia-Zeichen mit weissem Schweizer Kreuz auf rotem Verlaufskreis und einem Akzentpunkt.
    caption: "Der Punkt steht für die Person in der Plattform; der rote Verlauf steht für die Journey, ihre Etappen und den schrittweisen Weg zum Traum, in der Schweiz zu leben."
    variant: bare
    aspect: "auto"
    maxWidth: xs

  - type: heading
    text: Die Lösung

  - type: prose
    paragraphs:
      - "Das fertige Produkt verband Inhalte, Tools und Community in einem bezahlten Ökosystem. So hat es zusammengepasst:"


  - type: subheading
    text: "1. Eine personalisierte Home"

  - type: prose
    paragraphs:
      - "Der erste Screen zeigt sofort Relevantes:"

  - type: bullets
    items:
      - "Neuigkeiten"
      - "empfohlene Inhalte"
      - "Chancen"
      - "aktuelle Forumsbeiträge"
      - "Entdeckung nach Kanton"


  - type: video
    src: /media/cases/euvetia-platform/home-mobile.mp4
    placeholderLabel: Dashboard
    alt: Euvetia-Home-Dashboard auf dem Smartphone.
    caption: "Home-Oberfläche auf Mobile."
    variant: device
    aspect: "9/16"

  - type: prose
    paragraphs:
      - "Der Bereich „Nützlich für dich“ gruppiert Tools nach Journey-Stage:"

  - type: bullets
    items:
      - "Erkunden: Stellen, Kantonsvergleich, Volunteering, Gehaltsvergleich, Steuervergleich"
      - "Simulieren: Monatskosten, Steuerrechner, Hypothekenrechner, Währungsumrechnung"
      - "Leben: Mobilfunkpläne, Krankenversicherungen, Supermarktvergleich, SBB-Angebote"

  - type: prose
    paragraphs:
      - "Statt alle sofort durch das ganze System zu jagen, fokussiert das Produkt auf das, was jetzt zählt."

  - type: subheading
    text: "2. Erkundung nach Kanton"

  - type: prose
    paragraphs:
      - "Eine Schweizer Karte und Kantons-Filter helfen beim Vergleichen und Verorten von Entscheidungen. Das trägt zu einer zentralen Relocations-Frage bei: nicht nur ob, sondern wohin."

  - type: video
    src: /media/cases/euvetia-platform/euvetia-map-filter.mp4

  - type: subheading
    text: "3. Gemeinschaft"

  - type: prose
    paragraphs:
      - "Profile, Kontakte in derselben Phase, Diskussionen und privater Chat machen aus der Plattform ein Netz, nicht nur eine Content-Bibliothek."

  - type: subheading
    text: "5. Permit-checker"

  - type: prose
    paragraphs:
      - "Dieses kostenlose Tool ist der Einstieg: Es hilft schnell einzuschätzen, ob ein Umzug in die Schweiz grundsätzlich in Frage kommt, bevor man für die Plattform zahlt. Die ausführliche Fallstudie [hier](/work/euvetia-permit-checker)."

  - type: heading
    text: Was wir validiert haben

  - type: bullets
    items:
      - "über 100 Mitglieder in der Beta onboarded"
      - "über 10 Familien erfolgreich in die Schweiz gezogen"
      - "Plattform von Beta zum offiziellen Launch im April 2026"
      - "YouTube wurde ein glaubwürdiger Akquisekanal am oberen Ende des Funnels"
      - "Nutzerinnen und Nutzer zahlten für strukturierte Begleitung statt auf kostenlose, fragmentierte Quellen zu setzen"

  - type: heading
    text: Was diese Resultate zeigen

  - type: bullets
    items:
      - "die Nische ist real und unterversorgt"
      - "der Schmerz reicht aus, um Bezahlung zu rechtfertigen"
      - "Menschen schätzen eine zentrale, strukturierte Experience"
      - "Tools und Community multiplizieren den Wert der Inhalte"

  - type: prose
    paragraphs:
      - "Genau solche Signale zählen, bevor man auf Wachstum optimiert."

  - type: heading
    text: Nächste Schritte

  - type: prose
    paragraphs:
      - "Die nächste Phase macht die Experience persönlicher und handlungsorientierter:"

  - type: bullets
    items:
      - "Onboarding auf Profilbasis, das pro Person einen massgeschneiderten Relocation-Pfad erzeugt"
      - "Sprachkurse über Partnerschaften mit Lehrpersonen"
      - "Immobilien-Listings in Echtzeit für Miete und Kauf"
      - "weiter in Content-Produktion investieren, damit die Plattform aktuell, vertrauenswürdig und in jeder Umzugsphase wirklich nützlich bleibt."
