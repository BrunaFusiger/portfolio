  - type: heading
    text: Was wir validiert haben

  - type: bullets
    items:
      - "über 100 Mitglieder in der Beta onboarded (die Beta dauerte etwa ein Jahr)"
      - "über 10 Familien zogen während der Beta erfolgreich in die Schweiz"
      - "die Plattform wechselte von der Beta zum offiziellen Launch im April 2026"
      - "YouTube wurde ein Akquisekanal am oberen Ende des Funnels"

  - type: heading
    text: Was diese Resultate zeigen

  - type: bullets
    items:
      - "die Nische ist real und unterversorgt"
      - "der Schmerz reicht aus, um Bezahlung zu rechtfertigen"
      - "Menschen schätzen eine zentrale, strukturierte Experience"
      - "Tools und Community multiplizieren den Wert der Inhalte"

  - type: prose
    paragraphs:
      - "Genau solche Signale zählen, bevor man auf Wachstum optimiert."

  - type: heading
    text: Nächste Schritte

  - type: prose
    paragraphs:
      - "Die nächste Phase macht die Experience persönlicher und handlungsorientierter:"

  - type: bullets
    items:
      - "Onboarding auf Profilbasis, das pro Person einen massgeschneiderten Relocation-Pfad erzeugt"
      - "Sprachkurse über Partnerschaften mit Lehrpersonen"
      - "Immobilien-Listings in Echtzeit für Miete und Kauf"
      - "weiter in Content-Produktion investieren, damit die Plattform aktuell, vertrauenswürdig und in jeder Umzugsphase wirklich nützlich bleibt."

  - type: heading
    text: Ökosystem

  - type: prose
    paragraphs:
      - "Die Plattform ist das Ziel, aber der [Permit-Checker](/work/euvetia-permit-checker) und die [Website](/work/euvetia-website) sind die Einstiege. Lies die Case Studies für mehr Details."
