  - type: prose
    paragraphs:
      - "Ich kam als Gründungs-Produkt-Designerin dazu und arbeitete mit einer Entwicklerperson von Anfang bis Ende zusammen. Ich verantwortete den gesamten Design-Scope:"

  - type: inlineTags
    items:
      - Research
      - Produktstrategie
      - Markenstrategie
      - UX/UI
      - Informationsarchitektur
      - UX writing
      - Übergabe ans Front-end

  - type: prose
    paragraphs:
      - "Das Produkt ging offiziell im April 2026 live."

  - type: heading
    text: Die Chance

  - type: prose
    paragraphs:
      - "Brasilianische Auswanderung ist gross und wächst."

  - type: bracketBlock
    stats:
      - value: "4,9 Millionen"
        description: Brasilianerinnen und Brasilianer lebten 2023 im Ausland
      - value: Europa
        description: als zweitgrösste Zielregion nach Nordamerika
      - value: "40%"
        description: der Brasilianerinnen und Brasilianer sind am Leben im Ausland interessiert, und unter den bevorzugten Zielen taucht die Schweiz in der engeren Auswahl auf
      - value: "1,2 Millionen"
        description: der Brasilianerinnen und Brasilianer sind EU-Bürgerinnen und EU-Bürger
      - value: "2-6 Millionen"
        description: der Brasilianerinnen und Brasilianer haben Anspruch auf eine europäische Staatsangehörigkeit

  - type: prose
    paragraphs:
      - "Das Personenfreizügigkeitsabkommen der Schweiz gibt EU-Bürgerinnen und EU-Bürgern einen echten rechtlichen Weg, in der Schweiz zu leben und zu arbeiten. Für Brasilianerinnen und Brasilianer mit EU-/EFTA-Pass bleibt das oft unsichtbar — genau dort lag die Chance."


  - type: heading
    text: Das Problem

  - type: prose
    paragraphs:
      - "Wir wissen genau, dass viele Brasilianerinnen und Brasilianer an einen besseren Ort ziehen wollen."
      - "Die meisten wählen Länder wie:"

  - type: inlineTags
    items:
      - USA
      - Portugal
      - Kanada
      - Spanien
      - Vereinigtes Königreich

  - type: media
    src: /media/cases/euvetia-platform/top-destinations.png
    alt: Stilisierte 3D-Figuren in einer Reihe, von gross nach klein, mit Nationalflaggen auf dem Kopf—USA, Portugal, Kanada, Spanien und Vereinigtes Königreich—als abgestufte Präferenz für Auswanderungsziele.
    aspect: "16/9"
    variant: bare

  - type: prose
    paragraphs:
      - "Die Schweiz war oft gar nicht als realistische Option präsent."
      - "Nicht aus mangelndem Wunsch, sondern weil nicht bekannt war, dass es möglich ist."

  - type: highlighted
    text: "Der erste Teil unserer Arbeit war daher aufklärend: den Menschen zeigen, dass der Weg existiert, bevor wir sie auf ihm begleiten."

  - type: prose
    paragraphs:
      - "Und für diejenigen, die die Schweiz schon in Betracht zogen, war das Problem nicht fehlendes Wissen. Es fehlte Struktur."
      - "YouTube-Videos, Blogposts, WhatsApp-Gruppen, Behörden-Seiten, Expat-Foren. Überall gab es Teilantworten. Aber kein einziges Produkt half den Nutzerinnen und Nutzern wirklich zu klären:"

  - type: bullets
    items:
      - ob die Schweiz für ihren Fall überhaupt realistisch war
      - welcher Bewilligungsweg zu ihnen passte
      - womit sie zuerst starten und wie sie vorgehen sollten
      - wie sie Kantone, Jobs, Steuern und Lebenshaltungskosten vergleichen können
      - wie sie bürokratisches Risiko vor dem Umzug senken können
      - wie sie sich auf einen Job oder die Rente in der Schweiz vorbereiten können

  - type: prose
    paragraphs:
      - "Mit anderen Worten:"

  - type: highlighted
    text: "Brasilianerinnen und Brasilianer mit EU-Pass hatten legale Wege in die Schweiz, aber kein zentrales, portugiesischsprachiges Produkt, das Komplexität in klare nächste Schritte übersetzte."

  - type: prose
    paragraphs:
      - "Unsere letzte Motivation war, dass wir früh schon einen Beleg hatten: eine YouTube-Community und ein Beta-Zugangsmodell zeigten, dass Menschen bereit waren, für strukturierte Begleitung zu zahlen, statt alles alleine zusammenzupuzzeln."

  - type: heading
    text: Von der Discovery zur Produktstrategie

  - type: prose
    paragraphs:
      - "Das Projekt folgte einer Double-Diamond-Struktur."

  - type: subheading
    text: 1. Discover

  - type: prose
    paragraphs:
      - "Ich habe den Problemraum kartiert über:"

  - type: inlineTags
    items:
      - Desk Research
      - Competitor Review
      - qualitative Inhaltsanalyse von Community-Diskussionen online
      - Affinity Clustering
      - Personas

  - type: prose
    paragraphs:
      - "Ziel war, den Kontext der Nutzerinnen und Nutzer zu verstehen, bevor Lösungen vorgeschlagen werden."

  - type: media
    src: /media/cases/euvetia-platform/personas.png
    alt: Figma-Arbeitsfläche mit der Discover-Phase des Double Diamond für Euvetia—Research-Boards, Personas, Journey Maps und UI-Explorationen.
    caption: "Personas in Figma—Archetypen aus Verhaltensmustern und Bedürfnissen aus der Discovery-Research."
    variant: bare
    aspect: "16/9"

  - type: media
    src: /media/cases/euvetia-platform/discovery.png
    alt: Figma-Arbeitsfläche mit der Discover-Phase des Double Diamond für Euvetia—Research-Boards, Personas, Journey Maps und UI-Explorationen.
    caption: "Double-Diamond-Prozess in Figma—Discovery-Research, Affinity Mapping, Personas, Journeys und Flows."
    aspect: "16/9"

  - type: media
    src: /media/cases/euvetia-platform/define.png
    alt: Figma-Arbeitsfläche mit der Define-Phase des Double Diamond für Euvetia—Produktthese, strategische Entscheidungen und UI-Explorationen.
    caption: "Affinity Map in Figma—sammeln und clustern, Themen und Group Mapping—Notizen aus der Discovery zu Themen bündeln, bevor die Produktthese steht."
    variant: bare
    aspect: "16/9"

  - type: subheading
    text: 2. Define

  - type: prose
    paragraphs:
      - "Die Forschung führte zu einem klaren Schluss:"
      - "Euvetia sollte sich nicht wie ein Medienportal verhalten."

  - type: highlighted
    text: "Es sollte sich wie ein *Schweizer Taschenmesser für die Relocation* verhalten."

  - type: prose
    paragraphs:
      - "Alles, was für den Umzug nötig war, an einem Ort."
      - "Daraus wurden zwei strategische Entscheidungen:"

  - type: bullets
    items:
      - "Aufklärung + Tools + Community verbinden"
      - "Glaubwürdigkeit über eine ruhige, schweizerisch inspirierte visuelle Sprache aufbauen"

  - type: subheading
    text: 3. Develop

  - type: prose
    paragraphs:
      - "Mit klarer Strategie habe ich das in Architektur und Flows übersetzt:"

  - type: bullets
    items:
      - "Plattformarchitektur"
      - "Kernnavigation"
      - "Dashboard-Logik"
      - "Content-Gruppierung"
      - "Tool-Priorisierung"
      - "Community-Kontaktpunkte"
      - "Einstiege zum Permit-checker"
      - "Wireframes und Interaktionsflows"

  - type: media
    src: /media/cases/euvetia-platform/develop.png
    alt: Figma-Arbeitsfläche mit dem User Flow von Euvetia.
    caption: "Der Euvetia-Userflow in Figma aus der Develop-Phase."
    variant: bare
    aspect: "16/9"

  - type: subheading
    text: 4. Deliver

  - type: prose
    paragraphs:
      - "Ich habe die komplette produktionsreife Experience gestaltet und den Handoff vorbereitet:"

  - type: bullets
    items:
      - "Markenidentität"
      - "responsive Plattform-Screens"
      - "User flows"
      - "Component Library"
      - "UX writing"
      - "Design Tokens — Figma-MCP-freundlich"

  - type: media
    src: /media/cases/euvetia-platform/delivery.png
    alt: Euvetia-Figma-Datei mit Seiten nach Viewport, Component Library und Artboards für design-to-dev-Handoff.
    caption: "Die Master-Figma-Datei—Seiten: klar strukturierte component-per-page-Organisation, bei der Patterns, States und responsive Varianten zum tatsächlichen Build passen—kohärent, skalierbar und bereit für End-to-End-Entwicklung, ohne Nuancen zwischen Design und Engineering zu verlieren."
    aspect: "16/9"

  - type: heading
    text: Informationsarchitektur

  - type: prose
    paragraphs:
      - "Wir haben das Produkt in klare Bereiche gruppiert, etwa:"

  - type: bullets
    items:
      - "Inhalte"
      - "Kleinanzeigen"
      - "Tools"
      - "Forum"
      - "Chat"

  - type: video
    src: /media/cases/euvetia-platform/euvetia-architecture.mp4

  - type: heading
    text: Die Lösung

  - type: prose
    paragraphs:
      - "Das fertige Produkt verband Inhalte, Hilfsmittel und Community in einem bezahlten Ökosystem."

  - type: lottie
    src: /animations/euvetia-problem.json

  - type: subheading
    text: "1. Eine personalisierte Home"

  - type: prose
    paragraphs:
      - "Der erste Screen, den Nutzerinnen und Nutzer sehen, zeigt sofort Relevantes:"

  - type: bullets
    items:
      - "Neuigkeiten"
      - "empfohlene Inhalte"
      - "Chancen"
      - "aktuelle Forumsbeiträge"
      - "Entdeckung nach Kanton"

  - type: video
    src: /media/cases/euvetia-platform/home-mobile.mp4
    placeholderLabel: Dashboard
    alt: Euvetia-Home-Dashboard auf dem Smartphone.
    caption: "Home-Oberfläche auf Mobile."
    variant: device
    aspect: "9/16"

  - type: prose
    paragraphs:
      - "Der Bereich «Nützlich für dich» gruppiert Tools nach Journey-Phase:"

  - type: video
    src: /media/cases/euvetia-platform/tools.mp4

  - type: prose
    paragraphs:
      - "Erkunden:"
  - type: inlineTags
    items:
      - Stellen
      - Kantonsvergleich
      - Volunteering
      - Gehaltsvergleich
      - Steuervergleich

  - type: prose
    paragraphs:
      - "Simulieren:"
  - type: inlineTags
    items:
      - Monatskosten
      - Steuerrechner
      - Hypothekenrechner
      - Währungsumrechnung

  - type: prose
    paragraphs:
      - "Leben:"
  - type: inlineTags
    items:
      - Mobilfunkpläne
      - Krankenversicherungen
      - Supermarktvergleich
      - SBB-Angebote

  - type: prose
    paragraphs:
      - "Statt alle sofort durch das ganze System zu jagen, fokussiert das Produkt auf das, was jetzt zählt."

  - type: subheading
    text: "2. Erkundung nach Kanton"

  - type: prose
    paragraphs:
      - "Eine Schweizer Karte und ein Kantons-Filter helfen, Optionen zu vergleichen und Entscheidungen geografisch einzugrenzen. Das trägt zu einer zentralen Relocations-Frage bei: nicht nur ob, sondern wohin."

  - type: video
    src: /media/cases/euvetia-platform/euvetia-map-filter.mp4

  - type: subheading
    text: "3. Gemeinschaft"

  - type: prose
    paragraphs:
      - "Profile, Kontakte in derselben Phase, Diskussionen und privater Chat machen aus der Plattform ein Unterstützungsnetz, nicht nur eine Content-Bibliothek."

  - type: heading
    text: Marke und Interface

  - type: prose
    paragraphs:
      - "Marke und Interface baute ich auf Prinzipien, die vom Swiss Design inspiriert sind:"

  - type: bullets
    items:
      - "Klarheit statt Dekoration"
      - "starke Hierarchie"
      - "funktionale Layouts"
      - "hoher Kontrast"
      - "minimale Palette"
      - "direkte Sprache"
      - "geometrische Konsistenz"

  - type: prose
    paragraphs:
      - "Das war strategisch wichtig. Bei Bürokratie und Relocation wirkt visuelles Rauschen wie Risiko. Eine ruhigere Oberfläche signalisiert Stabilität, Legitimität und Kontrolle."

