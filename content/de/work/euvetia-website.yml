title: Euvetia Website
subtitle: Landing page mit Fokus auf Vertrauen für eine hochpreisige Relocationsplattform für Brasilianerinnen und Brasilianer mit EU-Pass, die in die Schweiz ziehen wollen.
tags:
  - Landing page design
  - conversion design
  - UX strategy
  - information architecture
  - UX writing
  - CRO
  - design system
  - responsive design
  - motion design
  - component-driven
  - accessibility
  - front-end handoff

liveIntro: Fertiges Projekt live ansehen
liveUrl: https://www.euvetia.ch

