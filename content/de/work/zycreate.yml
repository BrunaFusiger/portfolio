sections:
  - type: heading
    text: Projektüberblick

  - type: scrollytelling

  - type: prose
    paragraphs:
      - "Zytro ist ein Unternehmen für 3D-Visualisierung in Architektur und Immobilienwirtschaft und hilft Teams dabei, Räume zu zeigen und zu verkaufen, bevor sie gebaut sind."

  - type: media
    src: /media/cases/zycreate/zycreate.png
    alt: Screenshot von ZYcreate
    caption: "Screenshot von ZYcreate."
    variant: bare
    aspect: "auto"

  - type: prose
    paragraphs:
      - "ZYcreate war Teil dieses Ökosystems. Es war die Collaboration-Schicht zwischen den Zytro-Visualisiererinnen und -Visualisierern und den Kundenteams."

  - type: heading
    text: Das Problem

  - type: prose
    paragraphs:
      - "Vor ZYcreate war Feedback zerstreut."
      - "Teams haben Renderings per E-Mail, Screenshots, ausgedruckten Markierungen und langen Antwortketten begutachtet."
      - "Das wurde noch schwieriger, wenn ein Kunde mehrere Projekte, viele Bilder und unterschiedliche Stakeholder im Spiel hatte."
      - "Kontext ging leicht verloren. Entscheidungen nachzuvollziehen war mühsamer, als es sein musste."

  - type: heading
    text: Das Produkt

  - type: prose
    paragraphs:
      - "ZYcreate hat diesen Workflow in einem gemeinsamen Review-Raum gebündelt."

  - type: highlighted
    text: "ZYcreate bot Visualisiererinnen und Visualisierern sowie Kundinnen und Kunden ein gemeinsames Board, auf dem sie Renderings prüfen, Kommentare hinterlassen, Änderungen anfragen, direkt auf der Leinwand annotieren und unterstützende Assets durchsuchen oder hochladen konnten."

  - type: prose
    paragraphs:
      - "Ein Detail, das viel ausmachte, war Live-Übersetzung. Die meisten Visualisiererinnen und Visualisierer waren in Brasilien und sprachen Portugiesisch. Die meisten Kundinnen und Kunden waren im Vereinigten Königreich und sprachen Englisch. ZYcreate hat diese Kommunikationslücke im Workflow selbst verkleinert."

  - type: heading
    text: Was ich gestaltet habe

  - type: prose
    paragraphs:
      - "Ich habe die zentrale Review-Erfahrung gestaltet."
      - "Dazu gehörten die Board-Grundlage, Annotationswerkzeuge, Kommentare, die Asset-Bibliothek und die Gesamtstruktur der Oberfläche für kollaboratives Review."

  - type: heading
    text: Wie wir gearbeitet haben

  - type: prose
    paragraphs:
      - "Das war ein sehr kollaboratives Projekt."
      - "Die CEO brachte die operativen Schmerzpunkte aus dem Geschäft mit. Die Entwicklung half, Machbarkeit und Interaktionsmuster zu schärfen. Ich habe diese Bedürfnisse in Abläufe, Interface-Struktur und in die Review-Erfahrung selbst überführt."
