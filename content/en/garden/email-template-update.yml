    caption: Confirm email template before and after
    aspect: 'auto'
    variant: bare
    rounded: true

  - type: media
    src: /media/garden/email-template-update/mention-in-comment.png
    alt: Redesigned Euvetia mention in comment email template
    caption: Mention in comment template before and after
    aspect: 'auto'
    variant: bare
    rounded: true

  - type: media
    src: /media/garden/email-template-update/welcome.png
    alt: Redesigned Euvetia welcome email template
    caption: Welcome email template before and after
    aspect: 'auto'
    variant: bare
    rounded: true

  - type: bracketBlock
    paragraphs:
      - "It was a good reminder that brand is also built in the quiet parts of the experience."