body:
  - type: highlighted
    text: "A small redesign that made one of the most common product touchpoints feel more branded, modern, and intentional."

  - type: prose
    paragraphs:
      - "I redesigned Euvetia's email templates to make them feel more professional, more memorable, and more aligned with the brand."
      - "The goal was simple: turn a generic system message into something clearer, more polished, and instantly recognizable as part of the Euvetia experience."

