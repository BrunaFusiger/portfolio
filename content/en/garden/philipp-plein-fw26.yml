  - type: subheading
    text: What I learned about probabilistic tools

  - type: bracketBlock
    stats:
      - value: "≈5×"
        description: "images generated for every one that made the final selection"

  - type: media
    src: /media/garden/philipp-plein-fw26/selection-wall.jpg
    alt: A wall of dozens of selected AI-generated campaign images
    caption: The selects wall. And this is only what survived the cull
    aspect: 'auto'
    variant: bare
    rounded: true

  - type: process
    steps:
      - title: "Generation is cheap; selection is the work"
        text: "Roughly five images were generated, compared and discarded for every one that made the campaign. Most of my time went into searching, culling and selecting, not prompting."
      - title: "Consistency is the hard part"
        text: "Keeping one product, one model and one light across images and motion meant recreating FW26 pieces from runway screenshots and iterating against each tool's own biases."
      - title: "Direction doesn't get automated, it gets amplified"
        text: "The tools multiplied my output, but every decision that made this feel like one campaign instead of a mood board was human."

  - type: subheading
    text: What I delivered

  - type: bullets
    items:
      - Responsive homepage concept across desktop, tablet and mobile
      - "Three researched UX improvements: header, product card and footer"
      - FW26 launch film, AI-generated under my creative direction
      - Editorials, packshots and campaign imagery, with products recreated from public runway footage
      - Component-based Figma system with variables, auto-layout and design tokens, structured MCP-friendly
      - Nine-post Instagram launch campaign and a launch newsletter
      - Full research and design process documented in FigJam

  - type: subheading
    text: The Instagram launch

  - type: prose
    paragraphs:
      - "A nine-post feed composition introducing FW26 through movement, attitude and the PLEIN lifestyle. Retro-inspired collection reels, runway and celebrity moments that keep the brand culturally present, and a closing carousel that takes followers inside the collection. Luxury communication should create identification before asking for conversion."

  - type: media
    src: /media/garden/philipp-plein-fw26/instagram.jpg
    alt: Nine-post Instagram feed composition for the FW26 launch
    caption: The nine-post feed composition for the FW26 launch
    aspect: 'auto'
    variant: bare
    rounded: true

  - type: subheading
    text: The launch newsletter

  - type: prose
    paragraphs:
      - "The FW26 launch newsletter brings the campaign into the inbox: modular blocks designed to be technically achievable in real email clients, without sacrificing the campaign's visual identity."

  - type: media
    src: /media/garden/philipp-plein-fw26/newsletter.png
    alt: The FW26 launch newsletter design, from hero art to footer
    caption: The launch newsletter, from hero art to footer
    aspect: 'auto'
    variant: bare
    rounded: true
    maxWidth: xs

  - type: subheading
    text: Three researched UX improvements

  - type: prose
    paragraphs:
      - "The study is not a reskin. The design was built on the existing e-commerce, respecting its catalogue, content and technical limitations. On top of it, I documented three improvements grounded in usability research rather than taste."

  - type: process
    steps:
      - title: Header
        text: "Product categories visible at the first navigation level (hidden navigation cuts discoverability by almost 50%, NN/g), plus a contextual utility bar for location, language and support."
      - title: Product card
        text: "The product name leads the hierarchy, store-wide messages moved to a global highlights section, and sizes, colors and extra angles appear on hover."
      - title: Footer
        text: "A new global benefits area collects store-wide messages in one place, redesigned with metallic cues worthy of the brand."

  - type: prose
    paragraphs:
      - "This study is why I believe the next design roles are hybrid: the value is not in operating the tools, it is in knowing what to ask of them, and what to reject."
