body:
  - type: prose
    paragraphs:
      - I redesigned parts of an interactive real estate visualization interface used for large touchscreen showroom displays. 
      - The goal was to make the experience feel more branded, clearer, and more polished for presentation. 
      - Working with a developer and 3D visualizer, I helped move the interface away from a more generic base and toward something more aligned with Zytro’s visual language and the expectations of a premium sales environment.

