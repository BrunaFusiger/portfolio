    src: /media/cases/euvetia-platform/delivery.png
    alt: Euvetia Figma file with pages by screen size, a components library, and canvas artboards arranged for design-to-dev handoff.
    caption: "The master Figma file—pages: a well-structured, component-per-page organization where patterns, states, and responsive variants line up with how the product is actually built—coherent, scalable, and ready for end-to-end development without losing nuance between design and engineering"
    aspect: "16/9"

