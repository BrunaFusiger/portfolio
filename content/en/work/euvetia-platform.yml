  - type: prose
    paragraphs:
      - "Exploring:"
  - type: inlineTags
    items:
      - jobs
      - canton comparison
      - volunteering
      - salary comparison
      - tax comparison

  - type: prose
    paragraphs:
      - "Simulating:"
  - type: inlineTags
    items:
      - monthly costs
      - tax calculator
      - mortgage calculator
      - currency conversion

  - type: prose
    paragraphs:
      - "Living:"
  - type: inlineTags
