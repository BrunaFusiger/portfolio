  - type: heading
    text: The solution

  - type: prose
    paragraphs:
      - "The final product combined content, utilities, and community inside one paid ecosystem."

  - type: lottie
    src: /animations/euvetia-problem.json

  - type: subheading
    text: "1. A personalized home"

  - type: prose
    paragraphs:
      - "The first screen that users see shows relevant information immediately:"

  - type: bullets
    items:
      - "news"
      - "recommended content"
      - "opportunities"
      - "recent forum posts"
      - "canton-based discovery"


  - type: video
