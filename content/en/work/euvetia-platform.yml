      - front-end handoff

  - type: prose
    paragraphs:
      - "The product launched officially in April 2026."

  - type: heading
    text: The opportunity

  - type: prose
    paragraphs:
      - "Brazilian emigration is large and growing."

  - type: bracketBlock
    stats:
      - value: "4.9 million"
        description: Brazilians living abroad in 2023
      - value: Europe
        description: as the second-largest destination region after North America
      - value: "40%"
        description: of Brazilians are interested in living abroad, and among preferred destinations, Switzerland appears in the consideration set
      - value: "1.2 million"
        description: of Brazilians are European citizens
      - value: "2-6 million"
        description: of Brazilians are entitled to European nationality

  - type: prose
    paragraphs:
      - "Switzerland's Agreement on the Free Movement of Persons gives European citizens a real legal path to live and work there. For Brazilians with EU/EFTA passports, this is often overlooked and that gap was the opportunity."


  - type: heading
    text: The problem

  - type: prose
    paragraphs:
      - "We know for a fact that many Brazilians want to move to a better place."
      - "Most of them choose countries such as:"

  - type: inlineTags
    items:
      - United States
      - Portugal
      - Canada
      - Spain
      - United Kingdom

  - type: media
    src: /media/cases/euvetia-platform/top-destinations.png
    alt: Stylized 3D figures in a row, largest to smallest, with national flags on their heads—United States, Portugal, Canada, Spain, and United Kingdom—suggesting ranked preference for emigration destinations.
    aspect: "16/9"
    variant: bare

        
  - type: prose
    paragraphs:
      - "Switzerland wasn't even on their radar as a viable option."
      - "Not because of not wanting to, but because of not knowing that it was possible."

  - type: highlighted
    text: "So, the first part of our job was educational: helping users realize the path existed before helping them walk it."
          
  - type: prose
    paragraphs:
      - "And for those who do consider Switzerland, the problem wasn't a lack of information. It was a lack of structure."
      - "YouTube videos, blog posts, WhatsApp groups, government pages, expat forums. Pieces of the answer existed everywhere. But no single product helped users understand:"

  - type: bullets
    items:
      - whether Switzerland was actually viable for their case
      - which permit path applied to them
      - what to do first and how to do it
      - how to compare cantons, jobs, taxes, and living costs
      - how to reduce bureaucratic risk before relocating
      - how to prepare to get a job or retire in Switzerland

  - type: prose
    paragraphs:
      - "In other words:"

  - type: highlighted
    text: "Brazilians with EU passports had legal pathways to Switzerland, but no centralized, Portuguese-language product that turned complexity into clear action."

  - type: prose
    paragraphs:
      - "Our final motivation was that we already had early proof through a YouTube audience and beta access model that users were willing to pay for structured guidance instead of piecing it together alone."

  - type: heading
    text: From discovery to product strategy

  - type: prose
    paragraphs:
      - "The project followed a Double Diamond structure."

  - type: subheading
    text: 1. Discover

  - type: prose
    paragraphs:
      - "I mapped the problem space through:"

  - type: inlineTags
    items:
       - desk research
       - competitor review
       - qualitative content analysis of online community discussions
       - affinity clustering
       - personas
  - type: prose
    paragraphs:
      - "The goal was to understand users’ context before proposing solutions."

  - type: media
    src: /media/cases/euvetia-platform/personas.png
    alt: Figma workspace showing the Euvetia Double Diamond discovery phase—research boards, personas, journey maps, and UI explorations.
    caption: "Personas in Figma—defining user archetypes based on behavioral patterns and needs from discovery research."
    variant: bare
    aspect: "16/9"

  - type: media
    src: /media/cases/euvetia-platform/discovery.png
    alt: Figma workspace showing the Euvetia Double Diamond discovery phase—research boards, personas, journey maps, and UI explorations.
    caption: "Double Diamond process in Figma—discovery research, affinity mapping, personas, journeys, and flows."
    aspect: "16/9"
  
  - type: media
    src: /media/cases/euvetia-platform/define.png
    alt: Figma workspace showing the Euvetia Double Diamond define phase—product thesis, strategic decisions, and UI explorations.
    caption: "Affinity map in Figma—Ideate and group, Themes, and Group mapping—grouping notes from discovery into themes before the product thesis."
    variant: bare
    aspect: "16/9"

  - type: subheading
    text: 2. Define

  - type: prose
    paragraphs:
      - "The research pointed to one clear conclusion:"
      - "Euvetia shouldn't behave like a media portal."

  - type: highlighted
    text: "It should behave like a *Swiss Army knife for relocation*."

  - type: prose
    paragraphs:
      - "Everything users needed for the move in one place." 
      - "That shaped two strategic decisions:"

  - type: bullets
    items:
      - "combine education + tools + community"
      - "build credibility through a clean, Swiss-inspired visual language"

  - type: subheading
    text: 3. Develop

  - type: prose
    paragraphs:
      - "With the strategy defined, I translated it into architecture and flows:"

  - type: bullets
    items:
      - "platform architecture"
      - "core navigation"
      - "dashboard logic"
      - "content grouping"
      - "tool prioritization"
      - "community touchpoints"
      - "permit-checker entry points"
      - "wireframes and interaction flows"

  - type: media
    src: /media/cases/euvetia-platform/develop.png
    alt: Figma workspace showing the Euvetia user flow.
    caption: "The Euvetia user flow in Figma from the develop phase."
    variant: bare
    aspect: "16/9"

  - type: subheading
    text: 4. Deliver

  - type: prose
    paragraphs:
      - "I designed and handed off the full production-ready experience:"

  - type: bullets
    items:
