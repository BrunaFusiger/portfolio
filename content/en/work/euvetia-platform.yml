sections:
  - type: heading
    text: Project overview

  - type: scrollytelling

  - type: video
    src: /media/cases/euvetia-platform/home-desktop.mp4

  - type: prose
    paragraphs:
      - "Relocation platform for Brazilians with European passports who want to move to Switzerland. Content, tools, and community in one place."
      - "I joined as the solo/founding product designer, working alongside one engineer from end to end. I led the full design scope: research, product strategy, brand strategy, UX/UI, information architecture, UX writing, and front-end handoff."
      - "The product launched officially in April 2026."

  - type: prose
    paragraphs:
      - "The opportunity made sense for two reasons."

  - type: prose
    paragraphs:
      - "Brazilian emigration is large and growing:"

  - type: stat
    value: "4.9 million"
    description: Brazilians living abroad in 2023

  - type: stat
    value: Europe
    description: as the second-largest destination region after North America

  - type: prose
    paragraphs:
      - "Switzerland's Agreement on the Free Movement of Persons gives EU citizens a real legal path to live and work there. For Brazilians with European passports, this is often overlooked — and that gap was the opportunity."
      - "Recent research confirmed the demand:"

  - type: stat
    value: "40%"
    description: "of Brazilians are interested in living abroad, and among preferred destinations, Switzerland appears in the consideration set, even if far behind more obvious choices like the US and Portugal."


  - type: heading
    text: The problem

  - type: prose
    paragraphs:
      - "The problem wasn't a lack of information. It was a lack of structure."
      - "YouTube videos, blog posts, WhatsApp groups, government pages, expat forums. Pieces of the answer existed everywhere. But no single product helped users understand:"

  - type: bullets
    items:
      - whether Switzerland was actually viable for their case
      - which permit path applied to them
      - what to do first
      - how to compare cantons, jobs, taxes, and living costs
      - how to reduce bureaucratic risk before relocating

  - type: prose
    paragraphs:
      - "These weren't casual browsers. These were people making high-stakes life decisions — permits, housing, healthcare, family planning."
      - "The core problem became:"

  - type: highlighted
    text: "Brazilians with EU passports had legal pathways to Switzerland, but no centralized, Portuguese-language product that turned complexity into clear action."

  - type: prose
    paragraphs:
      - "We already had early proof through a YouTube audience and beta access model. Users were willing to pay for structured guidance instead of piecing it together alone."

  - type: lottie
    src: /animations/euvetia-problem.json

  - type: heading
    text: What surprised me

  - type: prose
    paragraphs:
      - "Users weren't asking for more information. They were asking for interpretation, sequencing, and confidence."
      - "In other words, the real friction wasn't content scarcity. It was decision overload."
      - "Four patterns kept repeating:"

  - type: subheading
    text: 1. Switzerland was under-considered

  - type: prose
    paragraphs:
      - "Most users defaulted to Portugal, Spain, Canada, or the US. Switzerland wasn't even on their radar as a viable option. Part of our job was educational — helping users realize the path existed before helping them walk it."

  - type: media
    src: /media/cases/euvetia-platform/top-destinations.png
    alt: Stylized 3D figures in a row, largest to smallest, with national flags on their heads—United States, Portugal, Canada, Spain, and United Kingdom—suggesting ranked preference for emigration destinations.
    aspect: "16/9"
    variant: bare

  - type: subheading
    text: 2. Users needed guidance

  - type: prose
    paragraphs:
      - "Someone still exploring had completely different needs from someone already simulating costs. A flat content experience would fail both. The product needed to adapt to where the user actually was."

  - type: subheading
    text: 3. Trust had to be designed, not claimed

  - type: prose
    paragraphs:
      - "Migration products can easily feel sensationalized, vague, or overly commercial. Users responded better to clarity, restraint, and evidence."

  - type: subheading
    text: 4. Simple tools unlocked disproportionate value

  - type: prose
    paragraphs:
      - "Comparing cantons, understanding taxes, estimating monthly costs, and checking permit-related paths often had more practical value than a big article alone."

  - type: video
    src: /media/cases/euvetia-platform/euvetia-architechture.mp4

  - type: heading
    text: From discovery to product strategy

  - type: prose
    paragraphs:
      - "The project followed a Double Diamond structure. (Not as a formality, but as a real working method.)"

  - type: heading
    text: Discover

  - type: prose
    paragraphs:
      - "I mapped the problem space through interviews, desk research, competitor review, behavioral observation, affinity clustering, and personas. The goal was to understand the user's world before proposing solutions."

  - type: media
    src: /media/cases/euvetia-platform/personas.png
    alt: Figma workspace showing the Euvetia Double Diamond discovery phase—research boards, personas, journey maps, and UI explorations.
    caption: "Personas in Figma—defining user archetypes based on behavioral patterns and needs from discovery research."
    variant: bare
    aspect: "16/9"

  - type: media
    src: /media/cases/euvetia-platform/discovery.png
    alt: Figma workspace showing the Euvetia Double Diamond discovery phase—research boards, personas, journey maps, and UI explorations.
    caption: "Double Diamond process in Figma—discovery research, affinity mapping, personas, journeys, and early flows that kept the team aligned."
    aspect: "16/9"

  - type: heading
    text: Define

  - type: prose
    paragraphs:
      - "The research pointed to one clear conclusion:"
      - "Euvetia shouldn't behave like a media portal."

  - type: highlighted
    text: "It should behave like a *swiss army knife for relocation*."

  - type: prose
    paragraphs:
      - "Everything users needed for the move in one place." 
      - "That shaped four strategic decisions:"

  - type: bullets
    items:
      - "organize the experience around user intent, not content type"
      - "combine education + tools + community"
      - "reduce cognitive load through stage-based navigation"
      - "build credibility through a clean, Swiss-inspired visual language"

  - type: media
    src: /media/cases/euvetia-platform/define.png
    alt: Figma workspace showing the Euvetia Double Diamond define phase—product thesis, strategic decisions, and UI explorations.
    caption: "Affinity map in Figma—Ideate and group, Themes, and Group mapping—grouping notes from discovery into themes before the product thesis."
    variant: bare
    aspect: "16/9"

  - type: heading
    text: Develop

  - type: prose
    paragraphs:
      - "With the strategy defined, I translated it into architecture and flows:"

  - type: bullets
    items:
      - "platform architecture"
      - "core navigation"
      - "dashboard logic"
      - "content grouping"
      - "tool prioritization"
      - "community touchpoints"
      - "permit-checker entry points"
      - "wireframes and interaction flows"

  - type: media
    src: /media/cases/euvetia-platform/develop.png
    alt: Figma workspace showing the Euvetia user flow.
    caption: "The Euvetia user flow in Figma from the develop phase."
    variant: bare
    aspect: "16/9"

  - type: heading
    text: Deliver

  - type: prose
    paragraphs:
      - "I designed and handed off the full production-ready experience:"

  - type: bullets
    items:
      - "brand identity"
      - "responsive platform screens"
      - "user flows"
      - "component library"
      - "UX writing"
      - "design tokens - Figma MCP friendly"

  - type: media
    src: /media/cases/euvetia-platform/delivery.png
    alt: Euvetia Figma file with pages by screen size, a components library, and canvas artboards arranged for design-to-dev handoff.
    caption: "The master Figma file—pages: a well-structured, component-per-page organization where patterns, states, and responsive variants line up with how the product is actually built—coherent, scalable, and ready for end-to-end development without losing nuance between design and engineering"
    aspect: "16/9"

  - type: heading
    text: Information architecture

  - type: prose
    paragraphs:
      - "We grouped the product around clear areas such as:"

  - type: bullets
    items:
      - "content"
      - "classifieds / opportunities"
      - "tools"
      - "forum"
      - "chat"

  - type: prose
    paragraphs:
      - "Inside the home tools area, we introduced stage-based segmentation:"

  - type: bullets
    items:
      - "Exploring"
      - "Simulating"
      - "Living"

  - type: prose
    paragraphs:
      - "This reduced noise and made the platform feel personal without heavy onboarding. Someone still exploring could compare cantons and jobs. Someone further ahead could estimate costs, review health plans, and plan practically."
      - "The structure turned a overwhelming subject into something progressively navigable."

  - type: video
    src: /media/cases/euvetia-platform/tools.mp4

  - type: heading
    text: Brand and interface

  - type: prose
    paragraphs:
      - "I built the brand and UI around principles inspired by Swiss design:"

  - type: bullets
    items:
      - "clarity over decoration"
      - "strong hierarchy"
      - "functional layouts"
      - "high contrast"
      - "minimal palette"
      - "direct language"
      - "geometric consistency"

  - type: prose
    paragraphs:
      - "This mattered strategically. In a product about bureaucracy and relocation, visual noise feels like risk. A cleaner interface communicates stability, legitimacy, and control."

  - type: media
    src: /media/cases/euvetia-platform/euvetia-brand-1.png
    alt: ""
    variant: bare
    aspect: "16/9"
    rounded: true

  - type: media
    src: /media/cases/euvetia-platform/euvetia-brand-2.png
    alt: ""
    variant: bare
    aspect: "auto"
    rounded: true

  - type: media
    src: /media/cases/euvetia-platform/Euvetia-logo.png
    alt: Euvetia mark with a white Swiss cross on a red gradient circle and an accent dot.
    caption: "The dot represents the user within the platform, while the red gradient symbolizes the journey, its different stages, and the progressive path toward the dream of moving to Switzerland."
    variant: bare
    aspect: "auto"
    maxWidth: xs

  - type: heading
    text: The solution

  - type: prose
    paragraphs:
      - "The final product combined content, utilities, and community inside one paid ecosystem. Here's how it came together:"


  - type: subheading
    text: "1. A personalized home"

  - type: prose
    paragraphs:
      - "The first screen user's sees shows relevant information immediately:"

  - type: bullets
    items:
      - "news"
      - "recommended content"
      - "opportunities"
      - "recent forum posts"
      - "canton-based discovery"


  - type: video
    src: /media/cases/euvetia-platform/home-mobile.mp4
    placeholderLabel: Dashboard
    alt: Euvetia home dashboard on mobile.
    caption: "Home surface on mobile."
    variant: device
    aspect: "9/16"

  - type: prose
    paragraphs:
      - "The “Useful for you” area groups tools by journey stage:"

  - type: bullets
    items:
      - "Exploring: jobs, canton comparison, volunteering, salary comparison, tax comparison"
      - "Simulating: monthly costs, tax calculator, mortgage calculator, currency conversion"
      - "Living: phone plans, health plans, supermarket comparison, SBB offers"

  - type: prose
    paragraphs:
      - "Instead of forcing users to understand the full system at once, the product narrows the focus to what matters right now."

  - type: subheading
    text: "2. Canton-based exploration"

  - type: prose
    paragraphs:
      - "A Switzerland map and canton filtering system help users compare and localize decisions. This supports a key relocation question: not just whether to move, but where."

  - type: video
    src: /media/cases/euvetia-platform/euvetia-map-filter.mp4

  - type: subheading
    text: "3. Community"

  - type: prose
    paragraphs:
      - "Users can build profiles, connect with others at the same stage, join discussions, and use private chat. The platform becomes a support network, not just a content library"

  - type: subheading
    text: "5. Permit-checker"

  - type: prose
    paragraphs:
      - "This free tool serves as the user's starting point, helping them quickly assess whether they are eligible to move to Switzerland before deciding to pay for the platform. Try it on the live site [here](https://www.euvetia.ch/check-permission)."

  - type: heading
    text: What we validated

  - type: bullets
    items:
      - "100+ members onboarded during beta"
      - "10+ families successfully relocated to Switzerland"
      - "Platform moved from beta to official launch in April 2026"
      - "YouTube became a top-of-funnel acquisition channel"
      - "Users paid for structured guidance instead of relying on free, fragmented sources"

  - type: heading
    text: What these results prove

  - type: bullets
    items:
      - "the niche is real and underserved"
      - "the pain is strong enough to justify payment"
      - "users value a centralized, structured experience"
      - "tools and community multiply the value of content"

  - type: prose
    paragraphs:
      - "That's the kind of signal that matters before optimizing for growth."

  - type: heading
    text: Next steps

  - type: prose
    paragraphs:
      - "The next phase is about making the experience more personal and more actionable:"

  - type: bullets
    items:
      - "profile-based onboarding that generates a tailored relocation path per user"
      - "language courses through teacher partnerships"
      - "real-time real estate listings for renting and buying"
      - "continuing to invest in content production to keep the platform current, trustworthy, and genuinely useful at every stage of the move."
