  - type: prose
    paragraphs:
      - "I joined as the founding product designer, working alongside one engineer from end to end. I led the full design scope:"

  - type: inlineTags
    items:
      - research
      - product strategy
      - brand strategy
      - UX/UI
      - information architecture
