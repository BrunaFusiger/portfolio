sections:
  - type: heading
    text: Project overview

  - type: scrollytelling


  - type: disclaimer
    text: "This is a confidential project, so I can only share a limited part of the product and its interface."
    
  - type: prose
    paragraphs:
      - "Zytro is a 3D visualization company for architecture and real estate, based in London, helping teams present and sell spaces before they are even built."

  - type: media
    src: /media/cases/zycreate/zycreate.png
    alt: ZYcreate screenshot
    caption: "ZYcreate screenshot."
    variant: bare
    aspect: "auto"

  - type: highlighted
    text: "As part of Zytro’s broader ecosystem of tools, ZYcreate plays a central role. It is the collaboration layer where Zytro visualizers and client teams review, discuss, and align on visual work."

  - type: heading
    text: The problem

  - type: prose
    paragraphs:
      - "Before ZYcreate, feedback was fragmented."
      - "Teams reviewed renders through email, screenshots, printed markups, and long reply chains."
      - "That process became even harder when one client had multiple projects, many images, and different stakeholders involved."
      - "Context was easy to lose. Tracking decisions was harder than it should have been."
      - "There was also a language barrier built into the workflow. Most visualizers were based in Brazil and spoke Portuguese. Most clients were in the UK and spoke English. That made feedback loops slower and added friction to an already complex review process."
      - "Assets were another pain point. In this context, assets meant visual elements such as:

  - type: inlineTags
    items:
    - sofas
    - chairs
    - tables
    - wood finishes
    - wallpapers
    - lighting references
    - other materials

  - type: prose
    paragraphs:
      - "Clients often requested changes based on assets that were not publicly available, poorly referenced, or shared without enough context. That made revisions slower and less precise."

  - type: heading
    text: The product

  - type: prose
    paragraphs:
      - "ZYcreate centralized that workflow into one collaborative space."

  - type: highlighted
    text: "It gave visualizers and clients a shared canvas where they could review renders, leave comments, request changes, annotate directly on the board, and browse or upload supporting assets with clearer reference information."

  - type: prose
    paragraphs:
      - "The asset library helped make requests more actionable. Instead of vague references, clients could upload or point to specific assets and indicate where they came from."
      - "Another important layer was live translation. It helped reduce friction inside the workflow by making conversations easier to follow in real time."

  - type: heading
    text: What I designed

  - type: prose
    paragraphs:
      - "I designed the core collaboration experience."
      - "That included:"

  - type: inlineTags
    items:
      - board foundation
      - annotation tools
      - comments
      - asset library
      - modal flows
      - interface structure

  - type: heading
    text: How we worked

  - type: prose
    paragraphs:
      - "This was a highly collaborative project."
      - "The CEO brought the operational pain points from the business. The developers helped shape feasibility and interaction patterns. I translated those needs into flows, interface structure, and the collaboration experience itself."