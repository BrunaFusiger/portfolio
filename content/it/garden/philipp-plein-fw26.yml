  - type: subheading
    text: Cosa ho imparato sugli strumenti probabilistici

  - type: bracketBlock
    stats:
      - value: "≈5×"
        description: "immagini generate per ognuna entrata nella selezione finale"

  - type: media
    src: /media/garden/philipp-plein-fw26/selection-wall.jpg
    alt: Una parete con decine di immagini di campagna selezionate, generate con IA
    caption: La parete dei selezionati. E questo è solo ciò che è sopravvissuto alla scrematura
    aspect: 'auto'
    variant: bare
    rounded: true

  - type: process
    steps:
      - title: "Generare costa poco; selezionare è il vero lavoro"
        text: "Per ogni immagine entrata in campagna, circa altre cinque sono state generate, confrontate e scartate. La maggior parte del mio tempo è andata in ricerca, scrematura e selezione, non nel prompting."
      - title: "La coerenza è la parte difficile"
        text: "Mantenere un prodotto, una modella e una luce attraverso immagini e video ha significato ricreare i capi FW26 da screenshot della sfilata e iterare contro i bias di ogni singolo strumento."
      - title: "La direzione non si automatizza, si amplifica"
        text: "Gli strumenti hanno moltiplicato il mio output, ma ogni decisione che ha reso questo una campagna invece di un moodboard è stata umana."

  - type: subheading
    text: Cosa ho realizzato

  - type: bullets
    items:
      - Concept di homepage responsive per desktop, tablet e mobile
      - "Tre miglioramenti UX basati sulla ricerca: header, scheda prodotto e footer"
      - Film di lancio FW26, generato con IA sotto la mia direzione creativa
      - Editoriali, packshot e immagini di campagna, con prodotti ricreati da materiale pubblico della sfilata
      - Sistema Figma a componenti con variabili, auto-layout e design token, strutturato MCP-friendly
      - Campagna di lancio Instagram di nove post e newsletter di lancio
      - Processo completo di ricerca e design documentato in FigJam

  - type: subheading
    text: Il lancio su Instagram

  - type: prose
    paragraphs:
      - "Una composizione feed di nove post che introduce FW26 attraverso movimento, attitudine e il lifestyle PLEIN. Reel della collezione in stile rétro, momenti di runway e celebrity che mantengono il brand culturalmente presente, e un carosello finale che porta i follower dentro la collezione. La comunicazione luxury dovrebbe creare identificazione prima di chiedere conversione."

  - type: media
    src: /media/garden/philipp-plein-fw26/instagram.jpg
    alt: Composizione feed Instagram di nove post per il lancio FW26
    caption: La composizione feed di nove post per il lancio FW26
    aspect: 'auto'
    variant: bare
    rounded: true

  - type: subheading
    text: La newsletter di lancio

  - type: prose
    paragraphs:
      - "La newsletter di lancio FW26 porta la campagna nella inbox: blocchi modulari progettati per essere tecnicamente realizzabili nei client email reali, senza sacrificare l'identità visiva della campagna."

  - type: media
    src: /media/garden/philipp-plein-fw26/newsletter.png
    alt: Il design della newsletter di lancio FW26, dalla hero art al footer
    caption: La newsletter di lancio, dalla hero art al footer
    aspect: 'auto'
    variant: bare
    rounded: true
    maxWidth: xs

  - type: subheading
    text: Tre miglioramenti UX basati sulla ricerca

  - type: prose
    paragraphs:
      - "Lo studio non è un semplice restyling. Il design è stato costruito sull'e-commerce esistente, rispettandone catalogo, contenuti e limiti tecnici. Su questa base ho documentato tre miglioramenti fondati sulla ricerca di usabilità, non sul gusto."

  - type: process
    steps:
      - title: Header
        text: "Categorie prodotto visibili al primo livello di navigazione (la navigazione nascosta riduce la scopribilità di quasi il 50%, NN/g), più una barra utility contestuale per località, lingua e supporto."
      - title: Scheda prodotto
        text: "Il nome del prodotto guida la gerarchia, i messaggi globali sono stati spostati in una sezione highlights globale, e taglie, colori e viste aggiuntive appaiono all'hover."
      - title: Footer
        text: "Una nuova area di benefit globali raccoglie i messaggi dello store in un unico posto, ridisegnata con dettagli metallici degni del brand."

  - type: prose
    paragraphs:
      - "Questo studio è il motivo per cui credo che i prossimi ruoli di design saranno ibridi: il valore non sta nell'usare gli strumenti, ma nel sapere cosa chiedere loro, e cosa rifiutare."
