title: Philipp Plein FW26, Studio di campagna
heroImage: /media/garden/philipp-plein-fw26/hero.png
heroAlt: Visual di campagna generato con IA per lo studio concettuale FW26, una coppia e un lupo nella neve, con lo slogan «Control the day. Own the night.»
tags:
  - IA Generativa
  - Direzione Creativa
  - Fashion
  - Studio Concettuale

body:
  - type: highlighted
    text: "Uno studio autonomo: l'IA generativa può produrre una campagna luxury completa che regga visivamente, narrativamente e commercialmente, quando la direzione creativa resta umana?"

  - type: disclaimer
    text: "Questo è uno studio concettuale indipendente, creato a scopo di apprendimento. Non è affiliato, commissionato o approvato da PHILIPP PLEIN. I prodotti mostrati sono stati ricreati da materiale pubblico della sfilata FW26 esclusivamente a scopo di studio."

  - type: prose
    paragraphs:
      - "L'IA generativa sta cambiando il modo in cui si produce il contenuto fashion, ma la maggior parte delle campagne fatte con l'IA sembra ancora fatta con l'IA. Volevo testare il contrario: scegliere uno dei brand più massimalisti della moda, darmi un brief reale e dirigere gli strumenti generativi come dirigerei un team di produzione."
      - "Prima di tutto, la ricerca. Ho studiato il brand e il suo fondatore, l'intera sfilata FW26, la copertura editoriale, i competitor e i comportamenti dei consumatori luxury, con la struttura del Double Diamond."

  - type: highlighted
    text: "Il risultato: FW26 è un guardaroba per il viaggio invernale di lusso. Composto di giorno, scatenato di notte. Quella dualità è diventata la campagna, Control the day. Own the night., ambientata nell'unico luogo che incarna entrambi: St. Moritz."

  - type: video
    src: /media/garden/philipp-plein-fw26/homepage.mp4
    placeholderLabel: Concept homepage FW26
    alt: Scorrimento del concept di homepage desktop FW26
    caption: "Il concept di homepage responsive: dalla storia della campagna alla scoperta prodotto, editoriali e artigianalità"
    variant: bare
    aspect: 'auto'

  - type: subheading
    text: L'IA come strumento di produzione sotto direzione creativa umana

  - type: prose
    paragraphs:
      - "La regola che mi sono data: l'IA genera, io dirigo. Ogni output doveva servire il concept, i codici del brand e un'estetica Canon primi anni 2000 scelta deliberatamente, non il look di default del modello."

  - type: inlineTags
    items:
      - ChatGPT / GPT Image
      - Nano Banana (Gemini)
      - Gemini Video / Veo
      - Kling AI 3.0
      - Hailuo AI
      - Luma AI

