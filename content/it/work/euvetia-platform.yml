sections:
  - type: heading
    text: Panoramica del progetto

  - type: scrollytelling

  - type: media
    src: /media/cases/euvetia-platform/euvetia-mockup-home.png
    alt: Dashboard home Euvetia su desktop.
    caption: Dashboard home Euvetia su desktop.
    variant: bare
    aspect: "auto"

  - type: prose
    paragraphs:
      - "Sono entrata come product designer fondatrice, affiancata da un ingegnere dall'inizio alla fine. Ho guidato l'intero ambito di design:"

  - type: inlineTags
    items:
      - ricerca
      - strategia di prodotto
      - strategia di brand
      - UX/UI
      - architettura dell'informazione
      - UX writing
      - handoff al front-end

  - type: prose
    paragraphs:
      - "Il prodotto è stato lanciato ufficialmente nell'aprile 2026."

  - type: heading
    text: L'opportunità

  - type: prose
    paragraphs:
      - "L'emigrazione brasiliana è ampia e in crescita."

  - type: bracketBlock
    stats:
      - value: "4,9 milioni"
        description: di brasiliani che vivevano all'estero nel 2023
      - value: Europa
        description: come seconda regione di destinazione dopo il Nord America
      - value: "40%"
        description: dei brasiliani è interessato a vivere all'estero, e tra le destinazioni preferite, la Svizzera rientra tra le opzioni considerate
      - value: "1,2 milioni"
        description: di brasiliani sono cittadini europei
      - value: "2-6 milioni"
        description: di brasiliani hanno diritto alla cittadinanza europea

  - type: prose
    paragraphs:
      - "L'Accordo sulla libera circolazione delle persone della Svizzera offre ai cittadini europei un percorso legale concreto per vivere e lavorare in Svizzera. Per i brasiliani con passaporto UE/AELS questo resta spesso invisibile — ed era lì la possibilità."


  - type: heading
    text: Il problema

  - type: prose
    paragraphs:
      - "Sappiamo per certo che molti brasiliani vogliono trasferirsi in un posto migliore."
      - "La maggior parte sceglie paesi come:"

  - type: inlineTags
    items:
      - Stati Uniti
      - Portogallo
      - Canada
      - Spagna
      - Regno Unito

  - type: media
    src: /media/cases/euvetia-platform/top-destinations.png
    alt: Figure 3D stilizzate in fila, dalla più grande alla più piccola, con bandiere nazionali sulla testa—Stati Uniti, Portogallo, Canada, Spagna e Regno Unito—a suggerire una preferenza tra destinazioni di emigrazione.
    aspect: "16/9"
    variant: bare

  - type: prose
    paragraphs:
      - "La Svizzera non era nemmeno tra le opzioni plausibili."
      - "Non per mancanza di desiderio, ma perché non si sapeva che fosse possibile."

  - type: highlighted
    text: "Quindi, la prima parte del nostro lavoro era formativa: aiutare le persone a capire che il percorso esisteva, prima di accompagnarle nei passi successivi."

  - type: prose
    paragraphs:
      - "E per chi già considerava la Svizzera, il problema non era la mancanza di informazioni. Mancava una struttura."
      - "Video su YouTube, articoli, gruppi WhatsApp, pagine istituzionali, forum per expat. Pezzi di risposta erano ovunque. Ma nessun singolo prodotto aiutava davvero a capire:"

  - type: bullets
    items:
      - se la Svizzera fosse davvero fattibile per il proprio caso
      - quale percorso di permesso si applicasse
      - cosa fare per primo e come farlo
      - come confrontare cantoni, lavoro, tasse e costo della vita
      - come ridurre il rischio burocratico prima del trasferimento
      - come prepararsi a trovare un lavoro o andare in pensione in Svizzera

  - type: prose
    paragraphs:
      - "In altre parole:"

  - type: highlighted
    text: "I brasiliani con passaporto UE avevano percorsi legali verso la Svizzera, ma nessun prodotto centralizzato in portoghese che trasformasse la complessità in azioni chiare."

  - type: prose
    paragraphs:
      - "La nostra motivazione finale era che avevamo già una prima prova con un pubblico su YouTube e un modello di accesso in beta: le persone erano disposte a pagare per una guida strutturata invece di rimettere insieme tutto da sole."

  - type: heading
    text: Dalla discovery alla strategia di prodotto

  - type: prose
    paragraphs:
      - "Il progetto ha seguito una struttura Double Diamond."

  - type: subheading
    text: 1. Discover

  - type: prose
    paragraphs:
      - "Ho mappato lo spazio del problema attraverso:"

  - type: inlineTags
    items:
      - desk research
      - analisi dei competitor
      - analisi qualitativa dei contenuti delle discussioni nelle community online
      - affinity clustering
      - personas

  - type: prose
    paragraphs:
      - "L'obiettivo era capire il contesto delle persone utenti prima di proporre soluzioni."

  - type: media
    src: /media/cases/euvetia-platform/personas.png
    alt: Workspace Figma con la fase Discover del Double Diamond di Euvetia—board di ricerca, personas, journey map ed esplorazioni UI.
    caption: "Personas in Figma—archetipi definiti da comportamenti e bisogni emersi dalla discovery research."
    variant: bare
    aspect: "16/9"

  - type: media
    src: /media/cases/euvetia-platform/discovery.png
    alt: Workspace Figma con la fase Discover del Double Diamond di Euvetia—board di ricerca, personas, journey map ed esplorazioni UI.
    caption: "Processo Double Diamond in Figma—discovery research, affinity mapping, personas, journey e flussi."
    aspect: "16/9"

  - type: media
    src: /media/cases/euvetia-platform/define.png
    alt: Workspace Figma con la fase Define del Double Diamond di Euvetia—tesi di prodotto, decisioni strategiche ed esplorazioni UI.
    caption: "Affinity map in Figma—ideare e raggruppare, temi e group mapping—note della discovery organizzate in temi prima della tesi di prodotto."
    variant: bare
    aspect: "16/9"

  - type: subheading
    text: 2. Define

  - type: prose
    paragraphs:
      - "La ricerca portava a una conclusione chiara:"
      - "Euvetia non doveva comportarsi come un portale media."

  - type: highlighted
    text: "Doveva comportarsi come un *coltellino svizzero per la relocation*."

  - type: prose
    paragraphs:
      - "Tutto ciò che serviva per il trasferimento, in un solo posto."
      - "Da lì sono nate due decisioni strategiche:"

  - type: bullets
    items:
      - "combinare formazione + tool + comunità"
      - "costruire credibilità con un linguaggio visivo pulito, ispirato alla Svizzera"

  - type: subheading
    text: 3. Develop

  - type: prose
    paragraphs:
      - "Con la strategia definita, l'ho tradotta in architettura e flussi:"

  - type: bullets
    items:
      - "architettura della piattaforma"
      - "navigazione principale"
      - "logica della dashboard"
      - "raggruppamento dei contenuti"
      - "prioritizzazione dei tool"
      - "punti di contatto della comunità"
      - "punti d'ingresso al permit-checker"
      - "wireframe e flussi di interazione"

  - type: media
    src: /media/cases/euvetia-platform/develop.png
    alt: Workspace Figma con lo user flow di Euvetia.
    caption: "Lo user flow di Euvetia in Figma nella fase Develop."
    variant: bare
    aspect: "16/9"

  - type: subheading
    text: 4. Deliver

  - type: prose
    paragraphs:
      - "Ho progettato e preparato il handoff dell'esperienza completa, pronta per la produzione:"

  - type: bullets
    items:
      - "identità di marca"
      - "schermate responsive della piattaforma"
      - "user flows"
      - "libreria di componenti"
      - "UX writing"
      - "design tokens — compatibili con Figma MCP"

  - type: media
    src: /media/cases/euvetia-platform/delivery.png
    alt: File Figma Euvetia con pagine per formato schermo, libreria di componenti e artboard organizzati per il handoff design-to-dev.
    caption: "Il file Figma master—pagine: organizzazione component-per-page in cui pattern, stati e varianti responsive rispecchiano come il prodotto è costruito—coerente, scalabile e pronto per lo sviluppo end-to-end senza perdere sfumature tra design e engineering."
    aspect: "16/9"

  - type: heading
    text: Architettura dell'informazione

  - type: prose
    paragraphs:
      - "Abbiamo raggruppato il prodotto in aree chiare come:"

  - type: bullets
    items:
      - "contenuti"
      - "annunci"
      - "tool"
      - "forum"
      - "chat"

  - type: video
    src: /media/cases/euvetia-platform/euvetia-architecture.mp4

  - type: heading
    text: La soluzione

  - type: prose
    paragraphs:
      - "Il prodotto finale ha unito contenuti, utilità e comunità in un ecosistema a pagamento."

  - type: lottie
    src: /animations/euvetia-problem.json

  - type: subheading
    text: "1. Una home personalizzata"

  - type: prose
    paragraphs:
      - "La prima schermata che le persone vedono mostra subito informazioni rilevanti:"

  - type: bullets
    items:
      - "novità"
      - "contenuti consigliati"
      - "opportunità"
      - "post recenti nel forum"
      - "scoperta per cantone"

  - type: video
    src: /media/cases/euvetia-platform/home-mobile.mp4
    placeholderLabel: Dashboard
    alt: Dashboard home Euvetia su mobile.
    caption: "Superficie home su mobile."
    variant: device
    aspect: "9/16"

  - type: prose
    paragraphs:
      - "L'area «Utile per te» raggruppa i tool per fase del percorso:"

  - type: video
    src: /media/cases/euvetia-platform/tools.mp4

  - type: prose
    paragraphs:
      - "Esplorazione:"
  - type: inlineTags
    items:
      - offerte di lavoro
      - confronto tra cantoni
      - volontariato
      - confronto stipendi
      - confronto tasse

  - type: prose
    paragraphs:
      - "Simulazione:"
  - type: inlineTags
    items:
      - costi mensili
      - calcolatore tasse
      - calcolatore mutui
      - conversione valuta

  - type: prose
    paragraphs:
      - "Vita sul posto:"
  - type: inlineTags
    items:
      - piani telefonici
      - piani sanitari
      - confronto supermercati
      - offerte SBB

  - type: prose
    paragraphs:
      - "Invece di costringere tutti a capire l'intero sistema in una volta, il prodotto restringe il focus a ciò che conta adesso."

  - type: subheading
    text: "2. Esplorazione per cantone"

  - type: prose
    paragraphs:
      - "Una mappa della Svizzera e un sistema di filtri per cantone aiutano a confrontare le opzioni e a restringere le decisioni in base al luogo. È una risposta a una domanda chiave della relocation: non solo se trasferirsi, ma dove."

  - type: video
    src: /media/cases/euvetia-platform/euvetia-map-filter.mp4

  - type: subheading
    text: "3. Comunità"

  - type: prose
    paragraphs:
      - "Le persone possono creare un profilo, connettersi con altri alla stessa fase, partecipare alle discussioni e usare la chat privata. La piattaforma diventa rete di supporto, non solo libreria di contenuti."

  - type: heading
    text: Brand e interfaccia

  - type: prose
    paragraphs:
      - "Ho costruito brand e interfaccia attorno a principi ispirati allo Swiss design:"

  - type: bullets
    items:
      - "chiarezza invece di decorazione"
      - "gerarchia forte"
      - "layout funzionali"
      - "alto contrasto"
      - "palette minimale"
      - "linguaggio diretto"
      - "coerenza geometrica"

  - type: prose
    paragraphs:
      - "Questo contava strategicamente. In un prodotto su burocrazia e relocation, il rumore visivo suona come rischio. Un'interfaccia più pulita comunica stabilità, legittimità e controllo."

  - type: media
    src: /media/cases/euvetia-platform/euvetia-brand-1.png
    alt: ""
    variant: bare
    aspect: "16/9"
    rounded: true

  - type: media
    src: /media/cases/euvetia-platform/euvetia-brand-2.png
    alt: ""
    variant: bare
    aspect: "auto"
    rounded: true

  - type: media
    src: /media/cases/euvetia-platform/Euvetia-logo.png
    alt: Marchio Euvetia con croce svizzera bianca su cerchio a gradiente rosso e punto accent.
    caption: "Il punto rappresenta la persona nella piattaforma; il gradiente rosso simboleggia il percorso, le sue fasi e il cammino progressivo verso il sogno di vivere in Svizzera."
    variant: bare
    aspect: "auto"
    maxWidth: xs

  - type: heading
    text: Cosa abbiamo validato

  - type: bullets
    items:
      - "oltre 100 persone onboardate durante la beta (è durata circa un anno)"
      - "oltre 10 famiglie si sono trasferite con successo in Svizzera durante la beta"
      - "la piattaforma è passata dalla beta al lancio ufficiale nell'aprile 2026"
      - "YouTube è diventato un canale di acquisizione in cima al funnel"

  - type: heading
    text: Cosa dimostrano questi risultati

  - type: bullets
    items:
      - "la nicchia è reale e poco servita"
      - "il problema è abbastanza forte da giustificare il pagamento"
      - "le persone danno valore a un'esperienza centralizzata e strutturata"
      - "tool e comunità moltiplicano il valore dei contenuti"

  - type: prose
    paragraphs:
      - "È il tipo di segnale che conta prima di ottimizzare per la crescita."

  - type: heading
    text: Prossimi passi

  - type: prose
    paragraphs:
      - "La fase successiva rende l'esperienza più personale e più orientata all'azione:"

  - type: bullets
    items:
      - "onboarding basato sul profilo che genera un percorso di relocation su misura per ogni persona"
      - "corsi di lingua tramite partnership con insegnanti"
      - "annunci immobiliari in tempo reale per affitto e acquisto"
      - "continuare a investire nella produzione di contenuti per mantenere la piattaforma attuale, affidabile e davvero utile in ogni fase del trasferimento."

  - type: heading
    text: Ecosistema

  - type: prose
    paragraphs:
      - "La piattaforma è l'obiettivo, ma il [permit checker](/work/euvetia-permit-checker) e il [sito](/work/euvetia-website) sono i punti di partenza. Leggi i case study per maggiori dettagli."
