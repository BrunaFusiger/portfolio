title: ZYhub

subtitle: Piattaforma RBAC per progetti e consegne, pensata per il team interno di Zytro e per le aziende clienti.

tags:
  - UX/UI
  - RBAC
  - design della piattaforma
  - prodotto enterprise
  - gestione progetti
  - centralizzazione dei flussi di lavoro
  - permessi
  - collaborazione
  - gestione file
  - pianificazione
  - analytics
  - visualizzazione architettonica

