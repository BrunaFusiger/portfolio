  - type: subheading
    text: O que aprendi sobre ferramentas probabilísticas

  - type: bracketBlock
    stats:
      - value: "≈5×"
        description: "imagens geradas para cada uma que entrou na seleção final"

  - type: media
    src: /media/garden/philipp-plein-fw26/selection-wall.jpg
    alt: Uma parede com dezenas de imagens de campanha selecionadas, geradas por IA
    caption: A parede de selecionadas. E isso é só o que sobreviveu à triagem
    aspect: 'auto'
    variant: bare
    rounded: true

  - type: process
    steps:
      - title: "Gerar é barato; selecionar é o trabalho"
        text: "Para cada imagem que entrou na campanha, cerca de outras cinco foram geradas, comparadas e descartadas. A maior parte do meu tempo foi buscar, filtrar e selecionar, não escrever prompts."
      - title: "Consistência é a parte difícil"
        text: "Manter um produto, uma modelo e uma luz entre imagens e vídeo significou recriar as peças FW26 a partir de screenshots do desfile e iterar contra os vieses de cada ferramenta."
      - title: "Direção não se automatiza, se amplifica"
        text: "As ferramentas multiplicaram minha produção, mas cada decisão que fez disso uma campanha em vez de um moodboard foi humana."

  - type: subheading
    text: O que eu entreguei

  - type: bullets
    items:
      - Conceito de homepage responsiva para desktop, tablet e mobile
      - "Três melhorias de UX baseadas em pesquisa: header, card de produto e footer"
      - Filme de lançamento FW26, gerado por IA sob minha direção criativa
      - Editoriais, packshots e imagens de campanha, com produtos recriados a partir de material público do desfile
      - Sistema Figma baseado em componentes com variáveis, auto-layout e design tokens, estruturado MCP-friendly
      - Campanha de lançamento no Instagram com nove posts e newsletter de lançamento
      - Processo completo de pesquisa e design documentado no FigJam

  - type: subheading
    text: O lançamento no Instagram

  - type: prose
    paragraphs:
      - "Uma composição de feed com nove posts que apresenta FW26 através de movimento, atitude e o lifestyle PLEIN. Reels da coleção em estilo retrô, momentos de desfile e celebridades que mantêm a marca culturalmente presente, e um carrossel final que leva os seguidores para dentro da coleção. Comunicação de luxo deve criar identificação antes de pedir conversão."

  - type: media
    src: /media/garden/philipp-plein-fw26/instagram.jpg
    alt: Composição de feed do Instagram com nove posts para o lançamento FW26
    caption: A composição de feed com nove posts para o lançamento FW26
    aspect: 'auto'
    variant: bare
    rounded: true

  - type: subheading
    text: A newsletter de lançamento

  - type: prose
    paragraphs:
      - "A newsletter de lançamento FW26 leva a campanha para a caixa de entrada: blocos modulares projetados para serem tecnicamente viáveis em clientes de email reais, sem sacrificar a identidade visual da campanha."

  - type: media
    src: /media/garden/philipp-plein-fw26/newsletter.png
    alt: O design da newsletter de lançamento FW26, da hero art ao footer
    caption: A newsletter de lançamento, da hero art ao footer
    aspect: 'auto'
    variant: bare
    rounded: true
    maxWidth: xs

  - type: subheading
    text: Três melhorias de UX baseadas em pesquisa

  - type: prose
    paragraphs:
      - "O estudo não é um reskin. O design foi construído sobre o e-commerce existente, respeitando seu catálogo, conteúdo e limitações técnicas. Sobre essa base, documentei três melhorias fundamentadas em pesquisa de usabilidade, não em gosto."

  - type: process
    steps:
      - title: Header
        text: "Categorias de produto visíveis no primeiro nível de navegação (navegação oculta reduz a descobribilidade em quase 50%, NN/g), mais uma barra utilitária contextual para localização, idioma e suporte."
      - title: Card de produto
        text: "O nome do produto lidera a hierarquia, mensagens globais foram movidas para uma seção de highlights global, e tamanhos, cores e ângulos extras aparecem no hover."
      - title: Footer
        text: "Uma nova área de benefícios globais reúne as mensagens da loja em um só lugar, redesenhada com detalhes metálicos à altura da marca."

  - type: prose
    paragraphs:
      - "Este estudo é o motivo pelo qual acredito que os próximos papéis de design serão híbridos: o valor não está em operar as ferramentas, está em saber o que pedir a elas, e o que recusar."
