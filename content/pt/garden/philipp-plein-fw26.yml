title: Philipp Plein FW26, Estudo de campanha
heroImage: /media/garden/philipp-plein-fw26/hero.png
heroAlt: Visual de campanha gerado por IA para o estudo conceitual FW26, um casal e um lobo na neve, com o slogan «Control the day. Own the night.»
tags:
  - IA Generativa
  - Direção Criativa
  - Fashion
  - Estudo Conceitual

body:
  - type: highlighted
    text: "Um estudo autoiniciado: a IA generativa consegue produzir uma campanha de luxo completa que se sustente visualmente, narrativamente e comercialmente, quando a direção criativa é humana?"

  - type: disclaimer
    text: "Este é um estudo conceitual independente, criado para fins de aprendizado. Não é afiliado, encomendado ou endossado pela PHILIPP PLEIN. Os produtos apresentados foram recriados a partir de material público do desfile FW26, exclusivamente para fins de estudo."

  - type: prose
    paragraphs:
      - "A IA generativa está mudando a forma como o conteúdo de moda é produzido, mas a maioria das campanhas feitas com IA ainda parece feita com IA. Eu queria testar o contrário: escolher uma das marcas mais maximalistas da moda, me dar um briefing de verdade e dirigir as ferramentas generativas como dirigiria uma equipe de produção."
      - "A pesquisa veio primeiro. Estudei a marca e seu fundador, o desfile FW26 completo, a cobertura editorial, os concorrentes e o comportamento do consumidor de luxo, estruturados pelo Double Diamond."

  - type: highlighted
    text: "O que emergiu: FW26 é um guarda-roupa para viagens de inverno de luxo. Contido de dia, solto à noite. Essa dualidade virou a campanha, Control the day. Own the night., ambientada no único lugar que incorpora os dois: St. Moritz."

  - type: video
    src: /media/garden/philipp-plein-fw26/homepage.mp4
    placeholderLabel: Conceito de homepage FW26
    alt: Rolagem pelo conceito de homepage desktop FW26
    caption: "O conceito de homepage responsiva: da história da campanha à descoberta de produto, editoriais e artesania"
    variant: bare
    aspect: 'auto'

  - type: subheading
    text: IA como ferramenta de produção sob direção criativa humana

  - type: prose
    paragraphs:
      - "A regra que estabeleci para mim: a IA gera, eu dirijo. Cada resultado precisava servir ao conceito, aos códigos da marca e a uma estética Canon dos anos 2000 escolhida deliberadamente, não ao visual padrão do modelo."

  - type: inlineTags
    items:
      - ChatGPT / GPT Image
      - Nano Banana (Gemini)
      - Gemini Video / Veo
      - Kling AI 3.0
      - Hailuo AI
      - Luma AI

