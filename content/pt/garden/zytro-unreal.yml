title: Redesign do archviz em Unreal Engine
heroImage: /media/garden/unreal-archviz/showroom.png
heroAlt: Interface de quiosque em touchscreen para visualização imobiliária no Unreal Engine
tags:
  - Zytro
  - Redesign de interface
  - Unreal Engine
  - ArchViz

body:
  - type: prose
    paragraphs:
      - Redesenhei partes de uma interface interativa de visualização imobiliária usada em telas touch grandes em showroom.
      - A ideia era deixar a experiência mais alinhada à marca, mais fácil de entender e com cara mais acabada para apresentações.
      - Junto com quem desenvolve e quem faz a visualização 3D, ajudei a sair de uma base mais genérica e chegar num visual mais próximo da linguagem da Zytro e do que se espera num ambiente de vendas premium.

