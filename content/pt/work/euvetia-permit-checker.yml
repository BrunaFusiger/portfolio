title: Verificador de permissão de residência

subtitle: Verificador suíço de permissão de residência que transformou regras densas de imigração num resultado curto, visual e personalizado.

tags:
  - UX/UI
  - product design
  - information architecture
  - content design
  - design system
  - complex systems
  - bento UI
  - legal simplification
  - personalization
  - research
  - prototyping

liveIntro: Veja o projeto final no ar
liveUrl: https://euvetia.ch/check-permission?substep=0

scrollytelling:
  - title: Papel
    label: Designer de produto fundadora
    image: /media/illustrations/job.png

  - title: Cronologia
    label: Jan 2026 – fev 2026
    image: /media/illustrations/calendar.png

  - title: Equipe
    label: 1 designer, 1 engenheiro
    image: /media/illustrations/team.png

  - title: Ferramentas
