sections:
  - type: heading
    text: Visão geral do projeto

  - type: scrollytelling

  - type: video
    src: /images/cases/euvetia-platform/home-desktop.mp4

  - type: prose
    paragraphs:
      - "Plataforma de relocação para brasileiros com passaporte europeu que querem se mudar para a Suíça. Conteúdo, ferramentas e comunidade num só lugar."
      - "Entrei como designer de produto solo e fundadora, lado a lado com um engenheiro, do começo ao fim. Conduzi todo o desenho do produto: pesquisa, estratégia de produto, estratégia de marca, UX/UI, information architecture, UX writing e front-end handoff."
      - "O produto foi lançado oficialmente em abril de 2026."

  - type: prose
    paragraphs:
      - "Essa oportunidade fazia sentido por dois motivos."

  - type: prose
    paragraphs:
      - "A emigração brasileira é grande e segue crescendo:"

  - type: stat
    value: "4,9 milhões"
    description: de brasileiros vivendo no exterior em 2023

  - type: stat
    value: Europa
    description: como segunda maior região de destino depois da América do Norte

  - type: prose
    paragraphs:
      - "O Acordo sobre a Livre Circulação de Pessoas da Suíça abre um caminho jurídico real para cidadãos da UE viverem e trabalharem no país. Para brasileiros com passaporte europeu, isso costuma passar despercebido — e foi nessa lacuna que nasceu a oportunidade."
      - "Pesquisas recentes reforçaram a demanda:"

  - type: stat
    value: "40%"
    description: "dos brasileiros têm interesse em morar no exterior; entre os destinos preferidos, a Suíça aparece no conjunto de opções consideradas, ainda que bem atrás de escolhas mais óbvias como os EUA e Portugal."


  - type: heading
    text: O problema

  - type: prose
    paragraphs:
      - "O problema não era falta de informação. Era falta de estrutura."
      - "Vídeos no YouTube, posts em blogs, grupos de WhatsApp, páginas do governo, fóruns de expatriados. Pedaços da resposta estavam em todo lugar. Mas nenhum produto ajudava as pessoas a entenderem:"

  - type: bullets
    items:
      - se a Suíça era de fato viável para o caso delas
      - qual caminho de permissão de residência se aplicava a elas
      - por onde começar
      - como comparar cantões, empregos, impostos e custo de vida
      - como reduzir o risco burocrático antes de se mudar

  - type: prose
    paragraphs:
      - "Não eram curiosos de passagem. Eram pessoas tomando decisões de vida com consequências enormes — permissões, moradia, saúde, planejamento familiar."
      - "No fundo, o problema era este:"

  - type: highlighted
    text: "Brasileiros com passaporte da UE tinham caminhos legais para a Suíça, mas nenhum produto centralizado em português que transformasse complexidade em ação clara."

  - type: prose
    paragraphs:
      - "Já tínhamos um primeiro sinal com a audiência no YouTube e o modelo de acesso beta: as pessoas estavam dispostas a pagar por uma orientação estruturada em vez de juntar tudo sozinhas."

  - type: lottie
    src: /animations/euvetia-problem.json

  - type: heading
    text: O que me surpreendeu

  - type: prose
    paragraphs:
      - "As pessoas não pediam mais informação. Pediam interpretação, ordem nos passos e confiança."
      - "Ou seja, o atrito real não era falta de conteúdo. Era excesso de decisões ao mesmo tempo."
      - "Quatro padrões voltavam sempre:"

  - type: subheading
    text: 1. A Suíça era pouco considerada

  - type: prose
    paragraphs:
      - "Na prática, muita gente pensava primeiro em Portugal, Espanha, Canadá ou EUA. A Suíça nem entrava no radar como opção viável. Parte do nosso trabalho era educativo — mostrar que o caminho existia, antes de ajudar a percorrê-lo."

  - type: media
    src: /images/cases/euvetia-platform/top-destinations.png
    alt: Figuras 3D estilizadas em fila, da maior para a menor, com bandeiras nos chapéus—Estados Unidos, Portugal, Canadá, Espanha e Reino Unido—sugerindo preferência por destinos de emigração.
    aspect: "16/9"
    variant: bare

  - type: subheading
    text: 2. As pessoas precisavam de orientação

  - type: prose
    paragraphs:
      - "Quem ainda estava explorando tinha necessidades totalmente diferentes de quem já simulava custos. Uma experiência plana de conteúdo falharia com os dois. O produto precisava se adaptar ao ponto em que a pessoa realmente estava."

  - type: subheading
    text: 3. A confiança tinha que ser desenhada, não só declarada

  - type: prose
    paragraphs:
      - "Produtos sobre migração fácil viram sensacionalismo, vago ou excesso de marketing. As pessoas responderam melhor a clareza, contenção e evidências."

  - type: subheading
    text: 4. Ferramentas simples geraram valor desproporcional

  - type: prose
    paragraphs:
      - "Comparar cantões, entender impostos, estimar custo mensal e checar caminhos ligados à permissão muitas vezes valiam mais na prática do que um artigo longo sozinho."

  - type: video
    src: /images/cases/euvetia-platform/euvetia-architechture.mp4

  - type: heading
    text: Da descoberta à estratégia de produto

  - type: prose
    paragraphs:
      - "O projeto seguiu uma estrutura de Double Diamond. (Não por formalidade, mas como método de trabalho de verdade.)"

  - type: heading
    text: Discover

  - type: prose
    paragraphs:
      - "Mapeei o espaço do problema com entrevistas, desk research, revisão de concorrentes, feedback do beta, observação de comportamento, affinity clustering e personas. O objetivo era entender o mundo de quem usa o produto antes de propor soluções."

  - type: media
    src: /images/cases/euvetia-platform/personas.png
    alt: Área de trabalho no Figma com a fase Discover do Double Diamond da Euvetia—quadros de pesquisa, personas, jornadas e explorações de UI.
    caption: "Personas no Figma—definindo arquétipos com base em padrões de comportamento e necessidades vindas da discovery research."
    variant: bare
    aspect: "16/9"

  - type: media
    src: /images/cases/euvetia-platform/discovery.png
    alt: Área de trabalho no Figma com a fase Discover do Double Diamond da Euvetia—quadros de pesquisa, personas, jornadas e explorações de UI.
    caption: "Double Diamond no Figma—discovery research, affinity mapping, personas, jornadas e fluxos iniciais que mantiveram o time alinhado."
    aspect: "16/9"

  - type: heading
    text: Define

  - type: prose
    paragraphs:
      - "A pesquisa apontou para uma conclusão clara:"
      - "A Euvetia não deveria se comportar como um portal de mídia."

  - type: highlighted
    text: "Deveria se comportar como um *swiss army knife for relocation*."

  - type: prose
    paragraphs:
      - "Tudo o que as pessoas precisavam para a mudança, reunido num só lugar."
      - "Isso moldou quatro decisões estratégicas:"

  - type: bullets
    items:
      - "organizar a experiência em torno da intenção da pessoa, não do tipo de conteúdo"
      - "combinar educação + tools + community"
      - "reduzir carga cognitiva com navegação por etapas (stage-based navigation)"
      - "construir credibilidade com uma linguagem visual limpa, inspirada na estética suíça"

  - type: media
    src: /images/cases/euvetia-platform/define.png
    alt: Área de trabalho no Figma com a fase Define do Double Diamond da Euvetia—tese de produto, decisões estratégicas e explorações de UI.
    caption: "Affinity map no Figma—Ideate and group, Themes e Group mapping—agrupando notas da discovery em temas antes da tese de produto."
    variant: bare
    aspect: "16/9"

  - type: heading
    text: Develop

  - type: prose
    paragraphs:
      - "Com a estratégia definida, traduzi isso em arquitetura e fluxos:"

  - type: bullets
    items:
      - "platform architecture"
      - "core navigation"
      - "dashboard logic"
      - "content grouping"
      - "tool prioritization"
      - "community touchpoints"
      - "permit-checker entry points"
      - "wireframes e interaction flows"

  - type: media
    src: /images/cases/euvetia-platform/develop.png
    alt: Área de trabalho no Figma com o user flow da Euvetia.
    caption: "O user flow da Euvetia no Figma na fase Develop."
    variant: bare
    aspect: "16/9"

  - type: heading
    text: Deliver

  - type: prose
    paragraphs:
      - "Desenhei e fiz o handoff da experiência completa, pronta para produção:"

  - type: bullets
    items:
      - "brand identity"
      - "responsive platform screens"
      - "user flows"
      - "component library"
      - "UX writing"
      - "design tokens — Figma MCP friendly"

  - type: media
    src: /images/cases/euvetia-platform/delivery.png
    alt: Arquivo Figma da Euvetia com páginas por tamanho de tela, biblioteca de componentes e artboards organizados para o handoff design-to-dev.
    caption: "O arquivo mestre no Figma—páginas: organização component-per-page, onde padrões, estados e variantes responsivas acompanham como o produto é construído—coerente, escalável e pronto para desenvolvimento ponta a ponta, sem perder nuance entre design e engenharia."
    aspect: "16/9"

  - type: heading
    text: Information architecture

  - type: prose
    paragraphs:
      - "Agrupamos o produto em áreas claras, como:"

  - type: bullets
    items:
      - "content"
      - "classifieds / opportunities"
      - "tools"
      - "forum"
      - "chat"

  - type: prose
    paragraphs:
      - "Na área de tools da home, introduzimos segmentação por etapa da jornada:"

  - type: bullets
    items:
      - Exploring
      - Simulating
      - Living

  - type: prose
    paragraphs:
      - "Isso reduziu ruído e deixou a plataforma mais pessoal sem um onboarding pesado. Quem ainda explorava podia comparar cantões e vagas. Quem estava mais adiante podia estimar custos, revisar planos de saúde e planejar com mais pé no chão."
      - "A estrutura transformou um assunto esmagador em algo que dá para navegar aos poucos."

  - type: video
    src: /images/cases/euvetia-platform/tools.mp4

  - type: heading
    text: Marca e interface

  - type: prose
    paragraphs:
      - "Construí marca e UI em torno de princípios inspirados no Swiss design:"

  - type: bullets
    items:
      - "clareza em vez de decoração"
      - "hierarquia forte"
      - "layouts funcionais"
      - "alto contraste"
      - "paleta minimal"
      - "linguagem direta"
      - "consistência geométrica"

  - type: prose
    paragraphs:
      - "Isso tinha peso estratégico. Num produto sobre burocracia e relocação, ruído visual soa como risco. Uma interface mais limpa comunica estabilidade, legitimidade e controle."

  - type: media
    src: /images/cases/euvetia-platform/euvetia-brand-1.png
    alt: ""
    variant: bare
    aspect: "16/9"
    rounded: true

  - type: media
    src: /images/cases/euvetia-platform/euvetia-brand-2.png
    alt: ""
    variant: bare
    aspect: "auto"
    rounded: true

  - type: media
    src: /images/cases/euvetia-platform/Euvetia-logo.png
    alt: Marca Euvetia com cruz suíça branca em círculo em gradiente vermelho e um ponto de destaque.
    caption: "O ponto representa a pessoa dentro da plataforma; o gradiente vermelho simboliza a jornada, suas etapas e o caminho progressivo rumo ao sonho de viver na Suíça."
    variant: bare
    aspect: "auto"
    maxWidth: xs

  - type: heading
    text: A solução

  - type: prose
    paragraphs:
      - "O produto final reuniu conteúdo, utilitários e community num ecossistema pago. Foi assim que encaixou:"


  - type: subheading
    text: "1. Uma home personalizada"

  - type: prose
    paragraphs:
      - "A primeira tela que a pessoa vê já traz o que importa:"

  - type: bullets
    items:
      - "news"
      - "recommended content"
      - "opportunities"
      - "recent forum posts"
      - "canton-based discovery"


  - type: video
    src: /images/cases/euvetia-platform/home-mobile.mp4
    placeholderLabel: Dashboard
    alt: Dashboard da home da Euvetia no mobile.
    caption: "Superfície da home no mobile."
    variant: device
    aspect: "9/16"

  - type: prose
    paragraphs:
      - "A área “Útil para você” agrupa tools por etapa da jornada:"

  - type: bullets
    items:
      - "Exploring: jobs, comparação de cantões, voluntariado, comparação salarial, comparação de impostos"
      - "Simulating: custos mensais, calculadora de impostos, calculadora de hipoteca, conversão de moeda"
      - "Living: planos de celular, planos de saúde, comparação de supermercados, ofertas SBB"

  - type: prose
    paragraphs:
      - "Em vez de obrigar todo mundo a entender o sistema inteiro de uma vez, o produto foca no que faz sentido agora."

  - type: subheading
    text: "2. Exploração por cantão"

  - type: prose
    paragraphs:
      - "Um mapa da Suíça e filtros por cantão ajudam a comparar e a localizar decisões. Isso responde a uma pergunta central da relocação: não só se mudar, mas para onde."

  - type: video
    src: /images/cases/euvetia-platform/euvetia-map-filter.mp4

  - type: subheading
    text: "3. Community"

  - type: prose
    paragraphs:
      - "As pessoas podem montar perfil, conectar com quem está na mesma etapa, participar de discussões e usar chat privado. A plataforma vira rede de apoio, não só biblioteca de conteúdo."

  - type: subheading
    text: "5. Permit-checker"

  - type: prose
    paragraphs:
      - "Essa tool gratuita é o ponto de partida: ajuda a avaliar rapidamente se há elegibilidade para ir à Suíça antes de decidir pagar pela plataforma. Case completo [aqui](/work/euvetia-permit-checker)."

  - type: heading
    text: O que validamos

  - type: bullets
    items:
      - "mais de 100 pessoas entraram na beta"
      - "mais de 10 famílias se reinstalaram com sucesso na Suíça"
      - "a plataforma saiu da beta para o lançamento oficial em abril de 2026"
      - "o YouTube virou um canal crível de aquisição no topo do funil"
      - "as pessoas pagaram por orientação estruturada em vez de depender só de fontes gratuitas e espalhadas"

  - type: heading
    text: O que esses resultados mostram

  - type: bullets
    items:
      - "o nicho é real e pouco atendido"
      - "a dor é forte o suficiente para justificar pagamento"
      - "as pessoas valorizam uma experiência centralizada e estruturada"
      - "tools e community multiplicam o valor do content"

  - type: prose
    paragraphs:
      - "Esse é o tipo de sinal que importa antes de otimizar para crescimento."

  - type: heading
    text: Próximos passos

  - type: prose
    paragraphs:
      - "A próxima fase é deixar a experiência mais pessoal e mais acionável:"

  - type: bullets
    items:
      - "profile-based onboarding que gera um caminho de relocação sob medida para cada pessoa"
      - "cursos de idiomas com parcerias de professores"
      - "listagens imobiliárias em tempo real para alugar e comprar"
      - "seguir investindo em produção de content para manter a plataforma atualizada, confiável e genuinamente útil em cada etapa da mudança."
