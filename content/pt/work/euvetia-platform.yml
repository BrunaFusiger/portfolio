sections:
  - type: heading
    text: Visão geral do projeto

  - type: scrollytelling

  - type: media
    src: /media/cases/euvetia-platform/euvetia-mockup-home.png
    alt: Dashboard inicial da Euvetia no desktop.
    caption: Dashboard inicial da Euvetia no desktop.
    variant: bare
    aspect: "auto"

  - type: prose
    paragraphs:
      - "Entrei como designer de produto fundadora, trabalhando lado a lado com um engenheiro de ponta a ponta. Conduzi todo o escopo de design:"

  - type: inlineTags
    items:
      - pesquisa
      - estratégia de produto
      - estratégia de marca
      - UX/UI
      - arquitetura da informação
      - UX writing
      - handoff para o front-end

  - type: prose
    paragraphs:
      - "O produto foi lançado oficialmente em abril de 2026."

  - type: heading
    text: A oportunidade

  - type: prose
    paragraphs:
      - "A emigração brasileira é grande e segue crescendo."

  - type: bracketBlock
    stats:
      - value: "4,9 milhões"
        description: de brasileiros vivendo no exterior em 2023
      - value: Europa
        description: como a segunda maior região de destino depois da América do Norte
      - value: "40%"
        description: dos brasileiros têm interesse em morar no exterior, e entre os destinos preferidos, a Suíça aparece no conjunto de opções consideradas
      - value: "1,2 milhões"
        description: de brasileiros são cidadãos europeus
      - value: "2-6 milhões"
        description: de brasileiros têm direito à nacionalidade europeia

  - type: prose
    paragraphs:
      - "O Acordo sobre a Livre Circulação de Pessoas da Suíça oferece aos cidadãos europeus um caminho jurídico real para viver e trabalhar no país. Para brasileiros com passaportes da UE/AELE, isso costuma passar despercebido — e essa lacuna era a oportunidade."


  - type: heading
    text: O problema

  - type: prose
    paragraphs:
      - "Sabemos com clareza que muitos brasileiros querem ir para um lugar melhor."
      - "A maioria escolhe países como:"

  - type: inlineTags
    items:
      - Estados Unidos
      - Portugal
      - Canadá
      - Espanha
      - Reino Unido

  - type: media
    src: /media/cases/euvetia-platform/top-destinations.png
    alt: Figuras 3D estilizadas em fila, da maior para a menor, com bandeiras nacionais nos chapéus—Estados Unidos, Portugal, Canadá, Espanha e Reino Unido—sugerindo preferência por destinos de emigração.
    aspect: "16/9"
    variant: bare

  - type: prose
    paragraphs:
      - "A Suíça nem entrava no radar como opção viável."
      - "Não por falta de vontade, mas por não saber que era possível."

  - type: highlighted
    text: "Então, a primeira parte do nosso trabalho era educativa: ajudar as pessoas a perceberem que o caminho existia, antes de ajudá-las a percorrê-lo."

  - type: prose
    paragraphs:
      - "E para quem já considerava a Suíça, o problema não era falta de informação. Era falta de estrutura."
      - "Vídeos no YouTube, posts em blogs, grupos de WhatsApp, páginas do governo, fóruns de expatriados. Pedaços da resposta estavam em todo lugar. Mas nenhum produto único ajudava as pessoas a entenderem:"

  - type: bullets
    items:
      - se a Suíça era de fato viável para o caso delas
      - qual caminho de permissão de residência se aplicava a elas
      - o que fazer primeiro e como fazer
      - como comparar cantões, empregos, impostos e custo de vida
      - como reduzir o risco burocrático antes de se mudar
      - como se preparar para conseguir um emprego ou se aposentar na Suíça

  - type: prose
    paragraphs:
      - "Em outras palavras:"

  - type: highlighted
    text: "Brasileiros com passaporte da UE tinham caminhos legais para a Suíça, mas nenhum produto centralizado em português que transformasse complexidade em ação clara."

  - type: prose
    paragraphs:
      - "Nossa motivação final era que já tínhamos uma prova inicial com audiência no YouTube e modelo de acesso beta: as pessoas estavam dispostas a pagar por orientação estruturada em vez de juntar tudo sozinhas."

  - type: heading
    text: Da descoberta à estratégia de produto

  - type: prose
    paragraphs:
      - "O projeto seguiu uma estrutura Double Diamond."

  - type: subheading
    text: 1. Discover

  - type: prose
    paragraphs:
      - "Mapeei o espaço do problema por meio de:"

  - type: inlineTags
    items:
      - desk research
      - revisão de concorrentes
      - análise qualitativa de conteúdo de discussões em comunidades online
      - affinity clustering
      - personas

  - type: prose
    paragraphs:
      - "O objetivo era entender o contexto das pessoas usuárias antes de propor soluções."

  - type: media
    src: /media/cases/euvetia-platform/personas.png
    alt: Área de trabalho no Figma com a fase Discover do Double Diamond da Euvetia—quadros de pesquisa, personas, mapas de jornada e explorações de UI.
    caption: "Personas no Figma—definindo arquétipos com base em padrões de comportamento e necessidades vindas da pesquisa de discovery."
    variant: bare
    aspect: "16/9"

  - type: media
    src: /media/cases/euvetia-platform/discovery.png
    alt: Área de trabalho no Figma com a fase Discover do Double Diamond da Euvetia—quadros de pesquisa, personas, mapas de jornada e explorações de UI.
    caption: "Processo Double Diamond no Figma—pesquisa de discovery, affinity mapping, personas, jornadas e fluxos."
    aspect: "16/9"

  - type: media
    src: /media/cases/euvetia-platform/define.png
    alt: Área de trabalho no Figma com a fase Define do Double Diamond da Euvetia—tese de produto, decisões estratégicas e explorações de UI.
    caption: "Mapa de afinidades no Figma—idear e agrupar, temas e group mapping—agrupando notas da discovery em temas antes da tese de produto."
    variant: bare
    aspect: "16/9"

  - type: subheading
    text: 2. Define

  - type: prose
    paragraphs:
      - "A pesquisa apontou para uma conclusão clara:"
      - "A Euvetia não deveria se comportar como um portal de mídia."

  - type: highlighted
    text: "Deveria se comportar como um *canivete suíço para a relocação*."

  - type: prose
    paragraphs:
      - "Tudo o que as pessoas precisavam para a mudança, reunido num só lugar."
      - "Isso moldou duas decisões estratégicas:"

  - type: bullets
    items:
      - "combinar educação + ferramentas + comunidade"
      - "construir credibilidade com uma linguagem visual limpa, inspirada na Suíça"

  - type: subheading
    text: 3. Develop

  - type: prose
    paragraphs:
      - "Com a estratégia definida, traduzi isso em arquitetura e fluxos:"

  - type: bullets
    items:
      - "arquitetura da plataforma"
      - "navegação principal"
      - "lógica do dashboard"
      - "agrupamento de conteúdo"
      - "priorização de ferramentas"
      - "pontos de contato da comunidade"
      - "pontos de entrada do permit-checker"
      - "wireframes e fluxos de interação"

  - type: media
    src: /media/cases/euvetia-platform/develop.png
    alt: Área de trabalho no Figma com o fluxo da pessoa usuária da Euvetia.
    caption: "O fluxo da Euvetia no Figma na fase Develop."
    variant: bare
    aspect: "16/9"

  - type: subheading
    text: 4. Deliver

  - type: prose
    paragraphs:
      - "Desenhei e fiz o handoff da experiência completa, pronta para produção:"

  - type: bullets
    items:
      - "identidade de marca"
      - "telas responsivas da plataforma"
      - "fluxos de uso"
      - "biblioteca de componentes"
      - "UX writing"
      - "design tokens — compatível com Figma MCP"

  - type: media
    src: /media/cases/euvetia-platform/delivery.png
    alt: Arquivo Figma da Euvetia com páginas por tamanho de tela, biblioteca de componentes e artboards organizados para o handoff design-to-dev.
    caption: "O arquivo mestre no Figma—páginas: organização component-per-page, onde padrões, estados e variantes responsivas acompanham como o produto é construído—coerente, escalável e pronto para desenvolvimento ponta a ponta, sem perder nuance entre design e engenharia."
    aspect: "16/9"

  - type: heading
    text: Arquitetura da informação

  - type: prose
    paragraphs:
      - "Agrupamos o produto em áreas claras, como:"

  - type: bullets
    items:
      - "conteúdo"
      - "classificados"
      - "ferramentas"
      - "fórum"
      - "chat"

  - type: video
    src: /media/cases/euvetia-platform/euvetia-architecture.mp4

  - type: heading
    text: A solução

  - type: prose
    paragraphs:
      - "O produto final reuniu conteúdo, utilidades e comunidade num ecossistema pago."

  - type: lottie
    src: /animations/euvetia-problem.json

  - type: subheading
    text: "1. Uma home personalizada"

  - type: prose
    paragraphs:
      - "A primeira tela que as pessoas veem mostra informações relevantes na hora:"

  - type: bullets
    items:
      - "notícias"
      - "conteúdo recomendado"
      - "oportunidades"
      - "posts recentes no fórum"
      - "descoberta por cantão"

  - type: video
    src: /media/cases/euvetia-platform/home-mobile.mp4
    placeholderLabel: Dashboard
    alt: Dashboard inicial da Euvetia no celular.
    caption: "Superfície da home no mobile."
    variant: device
    aspect: "9/16"

  - type: prose
    paragraphs:
      - "A área “Útil para você” agrupa ferramentas por etapa da jornada:"

  - type: video
    src: /media/cases/euvetia-platform/tools.mp4

  - type: prose
    paragraphs:
      - "Explorando:"
  - type: inlineTags
    items:
      - vagas
      - comparação de cantões
      - voluntariado
      - comparação salarial
      - comparação de impostos

  - type: prose
    paragraphs:
      - "Simulando:"
  - type: inlineTags
    items:
      - custos mensais
      - calculadora de impostos
      - calculadora de hipoteca
      - conversão de moeda

  - type: prose
    paragraphs:
      - "Vivendo:"
  - type: inlineTags
    items:
      - planos de celular
      - planos de saúde
      - comparação de supermercados
      - ofertas SBB

  - type: prose
    paragraphs:
      - "Em vez de obrigar todo mundo a entender o sistema inteiro de uma vez, o produto restringe o foco ao que importa agora."

  - type: subheading
    text: "2. Exploração por cantão"

  - type: prose
    paragraphs:
      - "Um mapa da Suíça e um sistema de filtros por cantão ajudam a comparar opções e a restringir decisões por local. Isso responde a uma pergunta central da relocação: não só se mudar, mas para onde."

  - type: video
    src: /media/cases/euvetia-platform/euvetia-map-filter.mp4

  - type: subheading
    text: "3. Comunidade"

  - type: prose
    paragraphs:
      - "As pessoas podem criar perfil, conectar com quem está na mesma etapa, participar de discussões e usar chat privado. A plataforma vira rede de apoio, não só biblioteca de conteúdo."

  - type: heading
    text: Marca e interface

  - type: prose
    paragraphs:
      - "Construí marca e interface em torno de princípios inspirados no design suíço:"

  - type: bullets
    items:
      - "clareza em vez de decoração"
      - "hierarquia forte"
      - "layouts funcionais"
      - "alto contraste"
      - "paleta minimal"
      - "linguagem direta"
      - "consistência geométrica"

  - type: prose
    paragraphs:
      - "Isso tinha peso estratégico. Num produto sobre burocracia e relocação, ruído visual soa como risco. Uma interface mais limpa comunica estabilidade, legitimidade e controle."

  - type: media
    src: /media/cases/euvetia-platform/euvetia-brand-1.png
    alt: ""
    variant: bare
    aspect: "16/9"
    rounded: true

  - type: media
    src: /media/cases/euvetia-platform/euvetia-brand-2.png
    alt: ""
    variant: bare
    aspect: "auto"
    rounded: true

  - type: media
    src: /media/cases/euvetia-platform/Euvetia-logo.png
    alt: Marca Euvetia com cruz suíça branca em círculo em gradiente vermelho e um ponto de destaque.
    caption: "O ponto representa a pessoa dentro da plataforma; o gradiente vermelho simboliza a jornada, suas etapas e o caminho progressivo rumo ao sonho de viver na Suíça."
    variant: bare
    aspect: "auto"
    maxWidth: xs

  - type: heading
    text: O que validamos

  - type: bullets
    items:
      - "mais de 100 pessoas onboardadas na beta (durou cerca de um ano)"
      - "mais de 10 famílias se reinstalaram com sucesso na Suíça durante a beta"
      - "a plataforma saiu da beta para o lançamento oficial em abril de 2026"
      - "o YouTube virou um canal de aquisição no topo do funil"

  - type: heading
    text: O que esses resultados comprovam

  - type: bullets
    items:
      - "o nicho é real e pouco atendido"
      - "a dor é forte o suficiente para justificar pagamento"
      - "as pessoas valorizam uma experiência centralizada e estruturada"
      - "ferramentas e comunidade multiplicam o valor do conteúdo"

  - type: prose
    paragraphs:
      - "Esse é o tipo de sinal que importa antes de otimizar para crescimento."

  - type: heading
    text: Próximos passos

  - type: prose
    paragraphs:
      - "A próxima fase é deixar a experiência mais pessoal e mais acionável:"

  - type: bullets
    items:
      - "onboarding baseado em perfil que gera um caminho de relocação sob medida para cada pessoa"
      - "cursos de idiomas com parcerias de professores"
      - "listagens imobiliárias em tempo real para alugar e comprar"
      - "seguir investindo em produção de conteúdo para manter a plataforma atualizada, confiável e genuinamente útil em cada etapa da mudança."

  - type: heading
    text: Ecossistema

  - type: prose
    paragraphs:
      - "A plataforma é o objetivo, mas o [verificador de permissão](/work/euvetia-permit-checker) e o [site](/work/euvetia-website) são os pontos de partida. Leia os estudos de caso para mais detalhes."
